<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐟 大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020d1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
#ui{position:fixed;top:12px;left:12px;z-index:10;display:flex;gap:10px;pointer-events:none}
#ui span{background:rgba(0,0,0,0.55);color:#fff;padding:7px 16px;border-radius:20px;font-size:14px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08)}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-size:30px;text-align:center;pointer-events:none;text-shadow:0 3px 15px rgba(0,0,0,0.6)}
#msg button{pointer-events:auto;margin-top:18px;padding:14px 40px;border:none;border-radius:28px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;font-size:20px;cursor:pointer;font-family:inherit;transition:transform 0.15s,box-shadow 0.2s;box-shadow:0 4px 20px rgba(255,107,107,0.4)}
#msg button:active{transform:scale(0.94)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#levelup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;color:#ffd700;font-size:40px;font-weight:700;pointer-events:none;text-shadow:0 0 40px rgba(255,215,0,0.6);opacity:0;transition:opacity 0.3s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span>🐟 <b id="score">0</b></span>
  <span>📏 <b id="size">20</b></span>
  <span id="lives">❤️❤️❤️</span>
</div>
<div id="levelup"></div>
<div id="msg"></div>
<div id="splash" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,13,26,0.85);backdrop-filter:blur(10px)"><div style="text-align:center;color:#fff;animation:fadeIn 0.6s ease"><div style="font-size:70px;margin-bottom:16px">🐟</div><h1 style="font-size:38px;margin:0 0 10px;text-shadow:0 3px 20px rgba(0,0,0,0.6)">大鱼吃小鱼</h1><p style="color:#8ab4d8;font-size:15px;margin:0 0 8px">吃小鱼长大 · 躲大鱼保命</p><p style="color:#5a7a8a;font-size:12px;margin:0 0 24px">电脑 WASD/方向键 · 手机滑动</p><button id="playBtn" style="padding:18px 52px;border:none;border-radius:34px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 24px rgba(255,107,107,0.5);transition:transform 0.15s;font-family:inherit" onmousedown="this.style.transform='scale(0.94)'" onmouseup="this.style.transform='scale(1)'">🎮 开始游戏</button><div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:10px">
<span style="color:#8ab4d8;font-size:13px">🔊 音效：</span>
<button id="sfxBtn" style="padding:8px 18px;border:1px solid rgba(255,255,255,0.2);border-radius:20px;background:rgba(255,255,255,0.08);color:#fff;font-size:13px;cursor:pointer;font-family:inherit">A · 叮铃</button>
<button id="sfxPreview" style="padding:8px 12px;border:1px solid rgba(255,255,255,0.15);border-radius:20px;background:rgba(255,255,255,0.04);color:#8ab4d8;font-size:12px;cursor:pointer;font-family:inherit">▶ 试听</button>
</div></div></div>
<script>
(function(){
var c=document.getElementById("c"),ctx=c.getContext("2d");var AC=null;window.AudioContext=window.AudioContext||window.webkitAudioContext
var W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
resize();window.addEventListener("resize",resize);

// ===== 全局状态 =====
var t=0; // 游戏帧计数，用于动画
var bubbles=[]; // 背景气泡
for(var i=0;i<60;i++)bubbles.push({x:Math.random()*2000,y:Math.random()*2000,r:1+Math.random()*4,s:0.2+Math.random()*0.4,o:0.03+Math.random()*0.08});

// ===== 玩家 =====
var startTime=Date.now();
var player={
  x:0,y:0,size:20,score:0,lives:3,invincible:0,vx:0,vy:0,
  grow:function(amt){var old=this.size;this.size+=amt;if(this.size>=220){this.size=220;if(old<220)gameWin();return}var nu=Math.floor(this.size);if(Math.floor(this.size/30)>Math.floor(old/30)&&nu>old){showLevelUp()}}
};
function showLevelUp(){var el=document.getElementById("levelup");el.textContent="⬆ 升级！";el.style.opacity="1";setTimeout(function(){el.style.opacity="0"},1500)}

// ===== 鱼种定义 =====
var SPECIES=[
  {n:"沙丁鱼",min:3,max:10,draw:drawSardine,tier:0,c:["#7ec8e3","#8ec5d6","#6ab0c8"]},
  {n:"孔雀鱼",min:4,max:12,draw:drawGuppy,tier:0,c:["#ff9aa2","#ffb347","#ff6f91","#845ec2"]},
  {n:"灯鱼",min:5,max:14,draw:drawTetra,tier:0,c:["#00bcd4","#009688","#26c6da"]},
  {n:"小丑鱼",min:12,max:28,draw:drawClown,tier:1,c:["#ff6f00","#e65100","#ff8f00"]},
  {n:"天使鱼",min:15,max:35,draw:drawAngel,tier:1,c:["#ce93d8","#ba68c8","#ab47bc","#7b1fa2"]},
  {n:"河豚",min:14,max:30,draw:drawPuff,tier:1,c:["#a5d6a7","#81c784","#66bb6a"]},
  {n:"鲈鱼",min:25,max:55,draw:drawBass,tier:2,c:["#8d6e63","#795548","#a1887f"]},
  {n:"三文鱼",min:30,max:60,draw:drawSalmon,tier:2,c:["#ef5350","#e57373","#f44336"]},
  {n:"鲶鱼",min:25,max:50,draw:drawCat,tier:2,c:["#78909c","#90a4ae","#607d8b"]},
  {n:"鲨鱼",min:45,max:100,draw:drawShark,tier:3,c:["#b0bec5","#90a4ae","#78909c"]},
  {n:"金枪鱼",min:50,max:110,draw:drawTuna,tier:3,c:["#3949ab","#1e88e5","#1565c0"]},
  {n:"鳐鱼",min:40,max:85,draw:drawRay,tier:3,c:["#546e7a","#455a64","#37474f"]},
];

function avail(){var tier=player.size<25?0:player.size<50?1:player.size<90?2:3;return SPECIES.filter(function(s){return s.tier<=tier})}

// ===== 鱼类绘图（14种独特形状）=====
function body(x,y,w,h,fc,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);var g=ctx.createLinearGradient(-w,0,w,0);g.addColorStop(0,'rgba(255,255,255,0.3)');g.addColorStop(0.4,fc);g.addColorStop(1,'rgba(0,0,0,0.15)');ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore()}
function eye(x,y,s,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.arc(s*0.65,-s*0.1,s*0.22,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.beginPath();ctx.arc(s*0.75,-s*0.08,s*0.11,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();ctx.restore()}
function tail(x,y,pa,pb,pc,pd,clr,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.lineTo(pc[0],pc[1]);ctx.closePath();ctx.fillStyle=clr;ctx.fill();ctx.restore()}

function drawSardine(x,y,s,fill,accent,d){body(x,y,s*1.3,s*0.48,accent,d);tail(x,y,[-s*0.9,0],[-s*1.7,-s*0.55],[-s*1.7,s*0.55],fill,d);eye(x,y,s,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);for(var j=0;j<8;j++){ctx.beginPath();ctx.arc(-s*0.6+Math.random()*s*1.2,-s*0.3+Math.random()*s*0.6,s*0.03,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.5)";ctx.fill()}ctx.beginPath();ctx.moveTo(-s*0.1,-s*0.4);ctx.quadraticCurveTo(0,-s*1,-s*0.5,-s*0.35);ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();ctx.restore()}
function drawGuppy(x,y,s,fill,accent,d){body(x,y,s*0.9,s*0.7,accent,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(-s*0.7,0);ctx.quadraticCurveTo(-s*1.6,-s*1.4,-s*1.2,-s*0.7);ctx.quadraticCurveTo(-s*1.8,0,-s*1.2,s*0.7);ctx.quadraticCurveTo(-s*1.6,s*1.4,-s*0.7,0);ctx.fillStyle=fill;ctx.fill();ctx.restore();eye(x,y,s,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);for(var i=0;i<10;i++){ctx.beginPath();ctx.arc(-s*0.3+Math.random()*s*0.8,-s*0.2+Math.random()*s*0.5,s*0.07,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.45)";ctx.fill()}ctx.restore()}
function drawTetra(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  ctx.beginPath();ctx.moveTo(s*1.1,0);ctx.quadraticCurveTo(0,-s*1.1,-s*0.9,0);ctx.quadraticCurveTo(0,s*1.1,s*1.1,0);ctx.fillStyle=accent;ctx.fill();
  // 荧光条纹
  ctx.beginPath();ctx.ellipse(0,0,s*0.5,s*0.4,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.25)";ctx.fill();
  ctx.restore();
  tail(x,y,[-s*0.8,0],[-s*1.4,-s*0.4],[-s*1.4,s*0.4],fill,d);
  eye(x,y,s,d);
}
function drawClown(x,y,s,fill,accent,d){
  body(x,y,s*1.05,s*0.7,fill,d);
  tail(x,y,[-s*1.0,0],[-s*1.7,-s*0.55],[-s*1.7,s*0.55],accent,d);
  // 白色条纹
  ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.ellipse(s*0.25,0,s*0.1,s*0.7,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.beginPath();ctx.ellipse(-s*0.3,0,s*0.1,s*0.7,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.restore();
  eye(x,y,s,d);
}
function drawAngel(x,y,s,fill,accent,d){
  body(x,y,s*0.6,s*1.5,accent,d);
  tail(x,y,[-s*0.7,0],[-s*1.3,-s*0.35],[-s*1.3,s*0.35],fill,d);
  eye(x,y,s*0.8,d);
}
function drawPuff(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  ctx.beginPath();ctx.arc(0,0,s*0.85,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,s*0.6,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.18)";ctx.fill();
  for(var i=0;i<14;i++){var an=i/14*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(an)*s*0.8,Math.sin(an)*s*0.8);ctx.lineTo(Math.cos(an)*s*1.05,Math.sin(an)*s*1.05);ctx.strokeStyle="rgba(0,0,0,0.12)";ctx.lineWidth=1.2;ctx.stroke()}
  ctx.restore();
  tail(x,y,[-s*0.8,0],[-s*1.2,-s*0.3],[-s*1.2,s*0.3],fill,d);
  eye(x,y,s*0.9,d);
}
function drawBass(x,y,s,fill,accent,d){
  body(x,y,s*1.2,s*0.65,accent,d);
  tail(x,y,[-s*1.1,0],[-s*1.8,-s*0.6],[-s*1.8,s*0.6],fill,d);
  // 侧线
  ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.3);ctx.quadraticCurveTo(0,-s*0.1,s*0.8,-s*0.25);ctx.strokeStyle="rgba(0,0,0,0.15)";ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  eye(x,y,s,d);
}
function drawSalmon(x,y,s,fill,accent,d){
  body(x,y,s*1.3,s*0.6,accent,d);
  tail(x,y,[-s*1.0,0],[-s*1.9,-s*0.7],[-s*1.3,-s*0.4],fill,d);
  eye(x,y,s,d);
}
function drawCat(x,y,s,fill,accent,d){
  body(x,y,s*1.1,s*0.55,accent,d);
  tail(x,y,[-s*1.0,0],[-s*1.6,-s*0.5],[-s*1.6,s*0.5],fill,d);
  // 胡须
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  ctx.beginPath();ctx.moveTo(s*1.0,-s*0.3);ctx.quadraticCurveTo(s*1.8,-s*1.5,s*1.2,-s*2.0);ctx.strokeStyle=fill;ctx.lineWidth=s*0.08;ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*1.0,s*0.3);ctx.quadraticCurveTo(s*1.8,s*1.5,s*1.2,s*2.0);ctx.strokeStyle=fill;ctx.lineWidth=s*0.08;ctx.stroke();
  ctx.restore();
  eye(x,y,s,d);
}
function drawShark(x,y,s,fill,accent,d){body(x,y,s*1.4,s*0.6,accent,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.45);ctx.lineTo(s*0.2,-s*2.4);ctx.lineTo(s*0.6,-s*0.45);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle="rgba(0,0,0,0.3)";ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.4,-s*0.3);ctx.lineTo(s*0.65,-s*0.5);ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.35,-s*0.1);ctx.lineTo(s*0.6,-s*0.25);ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.35,s*0.1);ctx.lineTo(s*0.6,s*0.25);ctx.stroke();ctx.restore();tail(x,y,[-s*1.0,-s*0.2],[-s*1.9,-s*1.1],[-s*1.6,0],fill,d);tail(x,y,[-s*1.0,s*0.2],[-s*1.9,s*1.1],[-s*1.6,0],fill,d);eye(x,y,s,d)}
function drawTuna(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  ctx.beginPath();ctx.moveTo(s*1.3,0);ctx.bezierCurveTo(s*0.6,-s*0.8,-s*0.3,-s*0.9,-s*0.9,-s*0.3);ctx.bezierCurveTo(-s*1.4,s*0.1,-s*0.8,s*0.7,0,s*0.6);ctx.bezierCurveTo(s*0.4,s*0.5,s*0.8,s*0.3,s*1.3,0);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
  // 鱼雷纹
  ctx.beginPath();ctx.ellipse(0,0,s*0.5,s*0.35,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fill();
  ctx.restore();
  tail(x,y,[-s*1.0,0],[-s*1.9,-s*0.6],[-s*1.3,-s*0.4],fill,d);
  eye(x,y,s,d);
}
function drawRay(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  ctx.beginPath();ctx.moveTo(s*1.2,0);ctx.quadraticCurveTo(s*0.6,-s*2,w,s*2.5);ctx.quadraticCurveTo(-s*0.3,-s*2.5,-s*0.5,-s*1.5);ctx.lineTo(-s*0.5,s*1.5);ctx.quadraticCurveTo(-s*0.3,s*2.5,w,s*2.5);ctx.quadraticCurveTo(s*0.6,s*2,s*1.2,0);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,s*0.3,s*0.6,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fill();
  ctx.restore();
}

// ===== 背景渲染 =====
function drawBg(){
  // 深海渐变
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0a3d62");
  grad.addColorStop(0.4,"#0c5278");
  grad.addColorStop(0.7,"#072d4a");
  grad.addColorStop(1,"#021520");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // 海底沙地
  var sand=ctx.createLinearGradient(0,H-60,0,H);
  sand.addColorStop(0,"rgba(30,60,50,0)");
  sand.addColorStop(1,"rgba(20,40,35,0.5)");
  ctx.fillStyle=sand;ctx.fillRect(0,H-60,W,60);

  // 海底石头
  for(var i=0;i<W;i+=80+Math.random()*60){
    ctx.beginPath();ctx.ellipse(i,H-10-Math.random()*20,15+Math.random()*20,6+Math.random()*8,0,0,Math.PI*2);
    ctx.fillStyle="rgba(15,30,25,0.4)";ctx.fill();
  }
  // 海草（预计算位置，不闪烁）
  if(!window.__weedData){
    window.__weedData=[];
    for(var ii=10;ii<3000;ii+=40+Math.random()*35){
      var hh=60+Math.random()*100;
      var c1=ii-15+Math.random()*30,c2=ii+20-Math.random()*30,c3=ii-5+Math.random()*10;
      var lf=Math.random()<0.5;
      window.__weedData.push({x:ii,h:hh,c1:c1,c2:c2,c3:c3,lf:lf});
    }
  }
  ctx.lineWidth=2.5;
  for(var i=0;i<window.__weedData.length;i++){
    var w=window.__weedData[i];
    ctx.beginPath();ctx.moveTo(w.x,H-5);
    ctx.bezierCurveTo(w.c1,H-w.h*0.4,w.c2,H-w.h*0.75,w.c3,H-w.h);
    ctx.strokeStyle="rgba(30,90,60,0.35)";ctx.stroke();
    if(w.lf){ctx.beginPath();ctx.moveTo(w.x,H-5);ctx.bezierCurveTo(w.x+10,H-w.h*0.5,w.x-10,H-w.h*0.8,w.x+15,H-w.h*0.7);ctx.stroke()}
  }

  // 光线（固定位置，不闪烁）
  if(!window.__lightData){
    window.__lightData=[];
    for(var ii=0;ii<5;ii++){
      window.__lightData.push({x:W*0.1+Math.random()*W*0.8,w:20+Math.random()*30,hw:25+Math.random()*20});
    }
  }
  ctx.globalAlpha=0.04;
  for(var i=0;i<window.__lightData.length;i++){
    var l=window.__lightData[i];
    var g2=ctx.createLinearGradient(l.x,0,l.x+l.w,H);
    g2.addColorStop(0,"#fff");g2.addColorStop(1,"transparent");
    ctx.fillStyle=g2;ctx.fillRect(l.x,0,l.hw,H);
  }
  ctx.globalAlpha=1;

  // 气泡
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.y-=b.s;if(b.y<-10){b.y=H+10;b.x=Math.random()*W}
    b.x+=Math.sin(t*0.02+b.y*0.01)*0.3;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,255,255,"+b.o+")";ctx.lineWidth=0.8;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-1,b.y-1,b.r*0.4,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,"+(b.o*1.5)+")";ctx.fill();
  }
}

// ===== NPC 鱼管理 =====
var fishes=[],spawnTimer=0;
function randIn(n){var v=Math.random()*n;return v<8?8+n*0.4:v}
function spawn(){
  var as=avail();var sp=as[Math.floor(Math.random()*as.length)];
  // 15% 能吃，85% 吃不了（始终跟随玩家体型）
  var bs;
  // 只有 6% 的鱼你能吃，其余 94% 都比你大
  if(Math.random()<0.03) bs=player.size*(0.4+Math.random()*0.3);
  else bs=player.size*(1.5+Math.random()*3.0);
  var sz=Math.max(sp.min,Math.min(sp.max,bs));
  var side=Math.floor(Math.random()*4),x,y,m=60;
  if(side===0){x=-m-randIn(sz*3);y=Math.random()*H}
  else if(side===1){x=W+m+randIn(sz*3);y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=-m-randIn(sz*3)}
  else{x=Math.random()*W;y=H+m+randIn(sz*3)}
  var tx=W/2+(Math.random()-0.5)*W*0.7,ty=H/2+(Math.random()-0.5)*H*0.7;
  var ang=Math.atan2(ty-y,tx-x);
  var spd=Math.max(0.12,0.6-sz*0.003);
  fishes.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,size:sz,species:sp,cid:Math.floor(Math.random()*sp.c.length),tt:80+Math.random()*200});
}
// ===== 4 种吃鱼音效方案 =====
var SFX={
  setup:function(){try{if(!AC||AC.state!=='running')return false;return true}catch(e){return false}},
  /** A: 清脆叮铃 — 像泡泡爆破 */
  A:function(s){
    if(!SFX.setup())return
    var t=AC.currentTime, f0=600+s*6
    for(var i=0;i<2;i++){
      var o=AC.createOscillator(),g=AC.createGain()
      o.type=i===0?"sine":"triangle"
      o.frequency.setValueAtTime(f0+i*200,t)
      o.frequency.exponentialRampToValueAtTime(f0+600,t+0.12)
      g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12)
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.13)
    }
  },
  /** B: 咔嚓脆响 — 像咬薯片 */
  B:function(s){
    if(!SFX.setup())return
    var t=AC.currentTime, buf=AC.createBuffer(1,AC.sampleRate*0.06,AC.sampleRate)
    var d=buf.getChannelData(0)
    for(var i=0;i<d.length;i++){var a=(d.length-i)/d.length;d[i]=(Math.random()*2-1)*0.3*a*a}
    var n=AC.createBufferSource(),ng=AC.createGain()
    n.buffer=buf;ng.gain.setValueAtTime(0.35,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.06)
    n.connect(ng);ng.connect(AC.destination);n.start(t);n.stop(t+0.06)
    // faint thump underneath
    var o=AC.createOscillator(),g=AC.createGain()
    o.type="sine";o.frequency.setValueAtTime(90,t);g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05)
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.05)
  },
  /** C: 啵溜吸吮 — 像喝珍珠奶茶吸到一颗 */
  C:function(s){
    if(!SFX.setup())return
    var t=AC.currentTime, f0=300-s*2
    var o=AC.createOscillator(),g=AC.createGain()
    o.type="sine";o.frequency.setValueAtTime(f0,t)
    o.frequency.exponentialRampToValueAtTime(f0*2.5,t+0.08)
    o.frequency.exponentialRampToValueAtTime(f0*1.2,t+0.12)
    g.gain.setValueAtTime(0.0,t);g.gain.linearRampToValueAtTime(0.25,t+0.03)
    g.gain.linearRampToValueAtTime(0.08,t+0.08)
    g.gain.exponentialRampToValueAtTime(0.001,t+0.2)
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2)
  },
  /** D: 咕嘟吞咽 — 像喝水咽下去 */
  D:function(s){
    if(!SFX.setup())return
    var t=AC.currentTime, f0=250-s*2
    var o=AC.createOscillator(),g=AC.createGain()
    o.type="sine";o.frequency.setValueAtTime(f0,t)
    o.frequency.exponentialRampToValueAtTime(f0*0.4,t+0.15)
    g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18)
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.18)
  }
};
var sfxName=["A","B","C","D"],sfxIdx=parseInt(localStorage.getItem("fishSfxIdx"))||0

function playEatSound(fishSize){var fn=SFX[sfxName[sfxIdx]];if(fn)fn(fishSize)}
function maintain(){
  // 换成固定的出生间隔，不维持数量
  spawnTimer--;
  if(fishes.length<40 && spawnTimer<=0){spawn(); spawnTimer=80+Math.floor(Math.random()*40);}
}

// ===== 粒子 =====
var parts=[];
function burst(x,y,clr,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3,l=15+Math.random()*25;if(parts.length<200)parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,r:1+Math.random()*3,c:clr})}
}

// ===== 输入 =====
var keys={},ta=false,tx=0,ty=0,ltx=0,lty=0;
document.addEventListener("keydown",function(e){keys[e.key]=true;if(e.key==="r"&&!running){restartGame()}e.preventDefault()});
document.addEventListener("keyup",function(e){keys[e.key]=false});
c.addEventListener("touchstart",function(e){e.preventDefault();var t=e.touches[0];ta=true;tx=t.clientX;ty=t.clientY;ltx=tx;lty=ty},{passive:false});
c.addEventListener("touchmove",function(e){e.preventDefault();var t=e.touches[0];ltx=tx;lty=ty;tx=t.clientX;ty=t.clientY},{passive:false});
c.addEventListener("touchend",function(e){ta=false});
var md=false,mx=0,my=0;
c.addEventListener("mousedown",function(e){md=true;mx=e.clientX;my=e.clientY});
c.addEventListener("mousemove",function(e){if(md){mx=e.clientX;my=e.clientY}});
c.addEventListener("mouseup",function(e){md=false});

// ===== 主循环 =====
function update(){
  t++;
  var ux=0,uy=0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"])ux-=1;if(keys["ArrowRight"]||keys["d"]||keys["D"])ux+=1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"])uy-=1;if(keys["ArrowDown"]||keys["s"]||keys["S"])uy+=1;
  if(ta){var dtlx=tx-ltx,dtly=ty-lty;var td=Math.sqrt(dtlx*dtlx+dtly*dtly);if(td>1){ux=dtlx/td;uy=dtly/td}}
  if(md){var dmx=mx-player.x,dmy=my-player.y;var dm=Math.sqrt(dmx*dmx+dmy*dmy);if(dm>10){ux=dmx/dm;uy=dmy/dm}}
  // 加速度：贴墙时不能往墙外方向加速
  var acc=0.04,maxSpd=1.2+player.size*0.001;
  if(ux||uy){
    if(player.x<=player.size&&ux<0)ux=0; if(player.x>=W-player.size&&ux>0)ux=0;
    if(player.y<=player.size&&uy<0)uy=0; if(player.y>=H-player.size&&uy>0)uy=0;
    player.vx+=ux*acc; player.vy+=uy*acc;
  }else{player.vx*=0.93; player.vy*=0.93}
  var sp=Math.sqrt(player.vx*player.vx+player.vy*player.vy);if(sp>maxSpd){player.vx=player.vx/sp*maxSpd;player.vy=player.vy/sp*maxSpd}
  player.x+=player.vx; player.y+=player.vy;
  // 硬边界修正：绝不让鱼超出画面
  if(player.x<player.size){player.x=player.size; player.vx=Math.max(player.vx,0)}
  if(player.x>W-player.size){player.x=W-player.size; player.vx=Math.min(player.vx,0)}
  if(player.y<player.size){player.y=player.size; player.vy=Math.max(player.vy,0)}
  if(player.y>H-player.size){player.y=H-player.size; player.vy=Math.min(player.vy,0)}
  if(player.invincible>0)player.invincible--;
  spawnTimer--;if(fishes.length<25&&spawnTimer<=0){spawn();spawnTimer=80+Math.floor(Math.random()*40)}

  // NPC 移动 + AI
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];f.x+=f.vx;f.y+=f.vy;f.tt--;
    var dpx=player.x-f.x,dpy=player.y-f.y,dpv=Math.sqrt(dpx*dpx+dpy*dpy);
    if(f.tt<=0){f.tt=80+Math.random()*160;
      var ang;
      if(f.size>player.size*1.3&&dpv<W*0.5&&Math.random()<0.45) ang=Math.atan2(dpy,dpx)+(Math.random()-0.5)*0.3; // 追
      else if(f.size<player.size*0.6&&dpv<80&&Math.random()<0.35) ang=Math.atan2(dpy,dpx)+Math.PI+(Math.random()-0.5)*0.6; // 逃
      else ang=Math.atan2(f.vy,f.vx)+(Math.random()-0.5)*1.5;
      var spd=Math.sqrt(f.vx*f.vx+f.vy*f.vy);f.vx=Math.cos(ang)*spd;f.vy=Math.sin(ang)*spd;
    }
    // NPC 鱼穿越画面（从一边出去，另一边进来）
    var mrg=f.size*5+80;
    if(f.x<-mrg) f.x=W+mrg;
    if(f.x>W+mrg) f.x=-mrg;
    if(f.y<-mrg) f.y=H+mrg;
    if(f.y>H+mrg) f.y=-mrg;
    // 超大幅超出才回收（极端情况兜底）
    if(Math.abs(f.x-W/2)>W*2||Math.abs(f.y-H/2)>H*2){fishes.splice(i,1)}
  }

  // 碰撞
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];var dx=player.x-f.x,dy=player.y-f.y;var dd=Math.sqrt(dx*dx+dy*dy);
    if(dd<(player.size+f.size)*0.65){
      if(player.size>f.size*1.25){player.grow(player.size*0.02);player.score+=Math.floor(f.size);burst(f.x,f.y,f.species.c[f.cid],8);fishes.splice(i,1);playEatSound(f.size)}
      else if(player.invincible<=0){player.lives--;player.invincible=150;player.vx=0;player.vy=0;burst(player.x,player.y,"#ff4444",25);if(player.lives<=0)gameOver()}
    }
  }

  // 粒子衰减
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)parts.splice(i,1)}
  // UI
  document.getElementById("score").textContent=player.score;
  document.getElementById("size").textContent=Math.floor(player.size);
  var hh="";for(var i=0;i<3;i++)hh+=(i<player.lives?"❤️":"🖤");document.getElementById("lives").textContent=hh;
}

function render(){
  drawBg();
  // NPC
  var sorted=fishes.slice().sort(function(a,b){return a.size-b.size});
  for(var i=0;i<sorted.length;i++){var f=sorted[i];var dir=Math.atan2(f.vy,f.vx);f.species.draw(f.x,f.y,f.size,f.species.c[f.cid],f.species.c[(f.cid+1)%f.species.c.length],dir)}
  // 玩家
  if(player.invincible<=0||Math.floor(player.invincible/4)%2===0){var pd=player.vx||player.vy?Math.atan2(player.vy,player.vx):0;ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor="rgba(255,150,100,0.6)";ctx.shadowBlur=player.size*0.6;ctx.translate(-player.x,-player.y);drawBass(player.x,player.y,player.size,"#ff6b6b","#ff8e8e",pd);ctx.restore()}
  // 粒子
  for(var i=0;i<parts.length;i++){var p=parts[i];ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life/p.max,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+(p.life/p.max*0.7)+")";ctx.fill()}
  // 大鱼警示虚线
  for(var i=0;i<sorted.length;i++){var f=sorted[i];if(f.size>player.size){ctx.beginPath();ctx.arc(f.x,f.y,f.size*1.2,0,Math.PI*2);ctx.setLineDash([4,8]);ctx.strokeStyle="rgba(255,60,60,0.3)";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])}}
}

var running=true;
function gameWin(){
  running=false;
  var elapsed=Math.floor((Date.now()-startTime)/1000);
  var mins=Math.floor(elapsed/60),secs=elapsed%60;
  document.getElementById("msg").innerHTML='<div style="font-size:40px">👑</div><div style="font-size:28px;margin-top:8px">你已成长为池塘之王！</div><div style="font-size:16px;margin-top:12px;opacity:0.8">最终体型：220 · 得分：'+player.score+'<br>用时：'+mins+'分'+secs+'秒</div><button onclick="location.reload()">🔄 再来一局</button><div style="font-size:14px;margin-top:10px;opacity:0.6">或按 R 键重新开始</div>';
}
function gameOver(){
  running=false;document.getElementById("msg").innerHTML='<div>🦈 被大鱼吃了！</div><div style="font-size:18px;margin-top:8px;opacity:0.8">得分：'+player.score+' · 体型：'+Math.floor(player.size)+'</div><button onclick="location.reload()">🔄 再来一局</button><div style="font-size:14px;margin-top:10px;opacity:0.6">或按 R 键重新开始</div>';
}

// 音效选择器
var sfxLabels=["A · 叮铃","B · 咔嚓","C · 啵溜","D · 咕嘟"];
function updateSfxUI(){document.getElementById("sfxBtn").textContent=sfxLabels[sfxIdx]}
updateSfxUI();
document.getElementById("sfxBtn").addEventListener("click",function(){sfxIdx=(sfxIdx+1)%4;localStorage.setItem("fishSfxIdx",sfxIdx);updateSfxUI()});
document.getElementById("sfxPreview").addEventListener("click",function(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext);AC.resume()}var fn=SFX[sfxName[sfxIdx]];if(fn)fn(25)});
document.getElementById("playBtn").addEventListener("click",function(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)}AC.resume().then(function(){console.log("Audio ready, state:",AC.state)}).catch(function(){});var testO=AC.createOscillator(),testG=AC.createGain();testO.frequency.value=1200;testG.gain.setValueAtTime(0.4,AC.currentTime);testG.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15);testO.connect(testG);testG.connect(AC.destination);testO.start();testO.stop(AC.currentTime+0.15);document.getElementById("splash").style.display="none";running=true;init()});
function init(){
  player.x=W/2;player.y=H/2;player.size=20;player.score=0;player.lives=3;player.invincible=90;
  fishes=[];parts=[];spawnTimer=8;
  for(var i=0;i<2;i++){var as=avail(),sp=as[0];var sz=sp.min+Math.random()*(sp.max-sp.min)*0.5;var ang=Math.PI*2/2*i;var d=100+Math.random()*100;fishes.push({x:W/2+Math.cos(ang)*d,y:H/2+Math.sin(ang)*d,vx:Math.cos(ang+1)*0.4,vy:Math.sin(ang+1)*0.4,size:sz,species:sp,cid:0,tt:120})}
}
function loop(){if(running)update();render();requestAnimationFrame(loop)}
loop();
})();
</script>
