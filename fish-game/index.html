<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐟 大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block;margin:0 auto}
#ui{position:fixed;top:10px;left:10px;z-index:10;display:flex;gap:16px;pointer-events:none}
#ui span{background:rgba(0,0,0,0.5);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;backdrop-filter:blur(4px)}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-size:28px;text-align:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,0.5);transition:opacity 0.3s}
#msg button{pointer-events:auto;margin-top:16px;padding:12px 32px;border:none;border-radius:24px;background:#ff6b6b;color:#fff;font-size:18px;cursor:pointer;font-family:inherit;transition:transform 0.15s}
#msg button:active{transform:scale(0.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span id="score">🐟 0</span>
  <span id="size">📏 20</span>
  <span id="lives">❤️❤️❤️</span>
</div>
<div id="msg"></div>
<script>
(function(){
var c=document.getElementById("c"),ctx=c.getContext("2d");
var W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
resize();window.addEventListener("resize",resize);

// ===== 玩家 =====
var player={
  x:0,y:0,size:20,score:0,lives:3,invincible:0,
  vx:0,vy:0,
  color:"#ff6b6b",
  bodyColor:"#ff8e8e",
  grow:function(amt){this.size+=amt;if(this.size>200)this.size=200}
};

// ===== 鱼种定义（每种有独特的绘制函数）=====
var SPECIES=[
  // Tier 0: 极小（玩家 size < 25）
  {name:"沙丁鱼",minSize:3,maxSize:10,draw:drawSmallElongated,tier:0,colors:["#7ec8e3","#8ec5d6","#6ab0c8"]},
  {name:"孔雀鱼",minSize:4,maxSize:12,draw:drawGuppy,tier:0,colors:["#ff9aa2","#ffb347","#ff6f91","#845ec2"]},
  {name:"灯鱼",minSize:5,maxSize:14,draw:drawDiamond,tier:0,colors:["#00bcd4","#009688","#26c6da"]},
  // Tier 1: 小（player size 25-50 解锁）
  {name:"小丑鱼",minSize:12,maxSize:28,draw:drawClownfish,tier:1,colors:["#ff6f00","#e65100","#ff8f00"]},
  {name:"天使鱼",minSize:15,maxSize:35,draw:drawAngelfish,tier:1,colors:["#ce93d8","#ba68c8","#ab47bc","#7b1fa2"]},
  {name:"河豚",minSize:14,maxSize:30,draw:drawPuffer,tier:1,colors:["#a5d6a7","#81c784","#66bb6a"]},
  // Tier 2: 中（player size 50-90 解锁）
  {name:"鲈鱼",minSize:25,maxSize:55,draw:drawBass,tier:2,colors:["#8d6e63","#795548","#a1887f"]},
  {name:"三文鱼",minSize:30,maxSize:60,draw:drawSalmon,tier:2,colors:["#ef5350","#e57373","#f44336"]},
  {name:"鲶鱼",minSize:25,maxSize:50,draw:drawCatfish,tier:2,colors:["#78909c","#90a4ae","#607d8b"]},
  // Tier 3: 大（player size 90-140 解锁）
  {name:"鲨鱼",minSize:45,maxSize:100,draw:drawShark,tier:3,colors:["#b0bec5","#90a4ae","#78909c"]},
  {name:"金枪鱼",minSize:50,maxSize:110,draw:drawTuna,tier:3,colors:["#3949ab","#1e88e5","#1565c0"]},
  {name:"鳐鱼",minSize:40,maxSize:85,draw:drawRay,tier:3,colors:["#546e7a","#455a64","#37474f"]},
];

// ===== 玩家可用鱼种（按当前体型动态计算）=====
function getAvailableSpecies(){
  var tier=player.size<25?0:player.size<50?1:player.size<90?2:3;
  return SPECIES.filter(function(s){return s.tier<=tier});
}

// ===== 七种不同的鱼形态 =====
function drawSmallElongated(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.3,h=s*0.5;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,h*0.1,w*0.8,h*0.4,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.2)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.9,0);ctx.lineTo(-w*1.6,-h*0.7);ctx.lineTo(-w*1.6,h*0.7);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.3,-h*0.7);ctx.quadraticCurveTo(0,-h*2,-w*0.5,-h*0.6);ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.6,-h*0.05,h*0.55,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.7,0,h*0.28,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawGuppy(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*0.9,h=s*0.7;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,w*0.7,h*0.6,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.25)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.8,0);ctx.quadraticCurveTo(-w*1.8,-h*1.2,-w*1.3,-h*0.8);ctx.quadraticCurveTo(-w*1.8,h*1.2,-w*0.8,0);ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.2,-h*0.8);ctx.quadraticCurveTo(0,-h*2,-w*0.3,-h*0.7);ctx.fillStyle="rgba(255,255,255,0.3)";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.55,-h*0.15,h*0.5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.65,-h*0.1,h*0.25,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawDiamond(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.0,h=s*0.6;
  ctx.beginPath();ctx.moveTo(w*1.1,0);ctx.quadraticCurveTo(w*0.6,-h*1.2,0,-h*1.0);ctx.quadraticCurveTo(-w*0.6,-h*1.2,-w*0.8,0);ctx.quadraticCurveTo(-w*0.6,h*1.2,0,h*1.0);ctx.quadraticCurveTo(w*0.6,h*1.2,w*1.1,0);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.5,0);ctx.lineTo(w*0.1,-h*0.6);ctx.lineTo(-w*0.4,0);ctx.lineTo(w*0.1,h*0.6);ctx.closePath();ctx.fillStyle="rgba(255,255,255,0.18)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.9,0);ctx.lineTo(-w*1.5,-h*0.5);ctx.lineTo(-w*1.5,h*0.5);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.arc(w*0.65,-h*0.05,h*0.45,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.75,0,h*0.22,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawClownfish(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.05,h=s*0.7;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  // 白色条纹
  ctx.beginPath();ctx.arc(0,0,w,h,0,Math.PI);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(w*0.3,0,w*0.12,h*1.05,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.ellipse(-w*0.3,0,w*0.12,h*1.05,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*1.0,0);ctx.lineTo(-w*1.7,-h*0.55);ctx.lineTo(-w*1.7,h*0.55);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.2,-h*0.8);ctx.quadraticCurveTo(-w*0.1,-h*1.8,-w*0.5,-h*0.6);ctx.fillStyle="rgba(0,0,0,0.1)";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.6,-h*0.05,h*0.5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.7,0,h*0.25,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawAngelfish(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*0.6,h=s*1.3;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,h*0.1,w*0.7,h*0.7,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.8,0);ctx.lineTo(-w*1.5,-h*0.4);ctx.lineTo(-w*1.5,h*0.4);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.1,-h*0.9);ctx.quadraticCurveTo(w*1.0,-h*1.8,-w*0.4,-h*0.8);ctx.fillStyle="rgba(0,0,0,0.1)";ctx.fill();
  // 身体条纹
  for(var i=-1;i<=1;i+=2){
    ctx.beginPath();ctx.moveTo(w*0.1,i*h*0.35);ctx.lineTo(-w*0.6,i*h*0.35);ctx.strokeStyle="rgba(0,0,0,0.15)";ctx.lineWidth=h*0.08;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(w*0.4,-h*0.05,h*0.4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.5,0,h*0.2,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawPuffer(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var r=s*0.8;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r*0.7,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.2)";ctx.fill();
  // 刺
  for(var i=0;i<16;i++){
    var ang=i/16*Math.PI*2;
    var x1=Math.cos(ang)*r*0.85,y1=Math.sin(ang)*r*0.85;
    var x2=Math.cos(ang)*r*1.15,y2=Math.sin(ang)*r*1.15;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="rgba(0,0,0,0.15)";ctx.lineWidth=1.5;ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(-r*0.9,0);ctx.lineTo(-r*1.4,-r*0.35);ctx.lineTo(-r*1.4,r*0.35);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.arc(r*0.45,-r*0.1,r*0.45,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(r*0.55,-r*0.05,r*0.22,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawBass(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.2,h=s*0.65;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-h*0.1,w*0.9,h*0.45,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*1.1,0);ctx.lineTo(-w*1.7,-h*0.6);ctx.lineTo(-w*1.7,h*0.6);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.3,-h*0.7);ctx.quadraticCurveTo(-w*0.1,-h*1.6,-w*0.6,-h*0.5);ctx.fillStyle="rgba(0,0,0,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.3,-h*0.5);ctx.lineTo(-w*0.6,-h*1.0);ctx.lineTo(-w*0.1,-h*0.5);ctx.strokeStyle="rgba(0,0,0,0.2)";ctx.lineWidth=h*0.1;ctx.stroke();
  ctx.beginPath();ctx.arc(w*0.55,-h*0.05,h*0.55,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.65,0,h*0.28,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawSalmon(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.3,h=s*0.6;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,h*0.1,w*0.7,h*0.4,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.2)";ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.8,-h*0.3);ctx.lineTo(w*0.6,-h*1.0);ctx.lineTo(w*0.3,-h*0.3);ctx.closePath();ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*1.0,0);ctx.quadraticCurveTo(-w*1.8,-h*0.7,-w*1.3,-h*0.5);ctx.quadraticCurveTo(-w*1.8,h*0.7,-w*1.0,0);ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.arc(w*0.7,-h*0.15,h*0.5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.8,-h*0.1,h*0.25,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawCatfish(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.1,h=s*0.55;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*1.0,0);ctx.lineTo(-w*1.6,-h*0.5);ctx.lineTo(-w*1.6,h*0.5);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  // 胡须
  ctx.beginPath();ctx.moveTo(w*1.0,-h*0.3);ctx.quadraticCurveTo(w*1.8,-h*1.5,w*1.2,-h*2.0);ctx.strokeStyle=fill;ctx.lineWidth=h*0.12;ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*1.0,h*0.3);ctx.quadraticCurveTo(w*1.8,h*1.5,w*1.2,h*2.0);ctx.strokeStyle=fill;ctx.lineWidth=h*0.12;ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*0.3,-h*0.7);ctx.quadraticCurveTo(-w*0.2,-h*1.5,-w*0.5,-h*0.5);ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.5,-h*0.05,h*0.5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.55,0,h*0.22,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawShark(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.4,h=s*0.6;
  ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
  // 三角背鳍
  ctx.beginPath();ctx.moveTo(-w*0.2,-h*0.5);ctx.lineTo(w*0.2,-h*2.0);ctx.lineTo(w*0.5,-h*0.5);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  // 胸鳍
  ctx.beginPath();ctx.moveTo(w*0.1,-h*0.3);ctx.quadraticCurveTo(w*0.5,-h*1.5,-w*0.3,-h*0.4);ctx.fillStyle="rgba(0,0,0,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.1,h*0.3);ctx.quadraticCurveTo(w*0.5,h*1.5,-w*0.3,h*0.4);ctx.fillStyle="rgba(0,0,0,0.15)";ctx.fill();
  // 尾
  ctx.beginPath();ctx.moveTo(-w*1.0,-h*0.2);ctx.lineTo(-w*1.8,-h*1.0);ctx.lineTo(-w*1.6,0);ctx.lineTo(-w*1.8,h*1.0);ctx.lineTo(-w*1.0,h*0.2);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.arc(w*0.6,-h*0.05,h*0.5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*0.7,0,h*0.25,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawTuna(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var t=s*0.3;
  ctx.beginPath();ctx.moveTo(s*1.3,0);ctx.bezierCurveTo(s*0.6,-s*0.8,-s*0.3,-s*0.9,-s*0.9,-s*0.3);ctx.bezierCurveTo(-s*1.4,s*0.1,-s*0.8,s*0.7,0,s*0.6);ctx.bezierCurveTo(s*0.4,s*0.5,s*0.8,s*0.3,s*1.3,0);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,s*0.8,s*0.5,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*1.0,0);ctx.quadraticCurveTo(-s*1.8,-s*0.6,-s*1.2,-s*0.4);ctx.quadraticCurveTo(-s*1.8,s*0.6,-s*1.0,0);ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(s*0.2,-s*0.5);ctx.lineTo(-s*0.1,-s*1.3);ctx.lineTo(s*0.5,-s*0.5);ctx.closePath();ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();
  ctx.beginPath();ctx.moveTo(s*0.2,s*0.5);ctx.lineTo(-s*0.1,s*1.3);ctx.lineTo(s*0.5,s*0.5);ctx.closePath();ctx.fillStyle="rgba(0,0,0,0.12)";ctx.fill();
  ctx.beginPath();ctx.arc(s*0.7,-s*0.05,s*0.45,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(s*0.8,0,s*0.22,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}
function drawRay(x,y,s,fill,accent,d){
  ctx.save();ctx.translate(x,y);ctx.rotate(d);
  var w=s*1.6,h=s*0.4;
  ctx.beginPath();ctx.moveTo(w*1.2,0);ctx.quadraticCurveTo(w*0.6,-h*2,w*0.2,-h*2.5);ctx.quadraticCurveTo(-w*0.3,-h*2.5,-w*0.5,-h*1.5);ctx.lineTo(-w*0.5,h*1.5);ctx.quadraticCurveTo(-w*0.3,h*2.5,w*0.2,h*2.5);ctx.quadraticCurveTo(w*0.6,h*2,w*1.2,0);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,w*0.4,h*0.8,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fill();
  ctx.beginPath();ctx.moveTo(-w*0.5,0);ctx.lineTo(-w*0.9,h*0.3);ctx.lineTo(-w*0.9,-h*0.3);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.arc(w*0.9,-h*0.05,h*0.4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(w*1.0,0,h*0.2,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.restore();
}

// ===== NPC 鱼 =====
var fishes=[];
var spawnTimer=0;
function spawnFish(){
  var available=getAvailableSpecies();
  var sp=available[Math.floor(Math.random()*available.length)];
  // 鱼的大小围绕玩家体型分布：70% 比玩家大，30% 比玩家小
  var baseSize;
  if(Math.random()<0.7){
    // 比玩家大 1.1~2.5 倍
    baseSize=player.size*(1.1+Math.random()*1.4);
  }else{
    // 比玩家小 0.5~0.9 倍
    baseSize=player.size*(0.5+Math.random()*0.4);
  }
  // 限制在鱼种的体型范围内
  var size=Math.max(sp.minSize,Math.min(sp.maxSize,baseSize));
  // 边沿生成
  var side=Math.floor(Math.random()*4);
  var x,y,margin=50;
  if(side===0){x=-margin-mathrand(size*3);y=Math.random()*H}
  else if(side===1){x=W+margin+mathrand(size*3);y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=-margin-mathrand(size*3)}
  else{x=Math.random()*W;y=H+margin+mathrand(size*3)}
  var targetX=W/2+(Math.random()-0.5)*W*0.6;
  var targetY=H/2+(Math.random()-0.5)*H*0.6;
  var ang=Math.atan2(targetY-y,targetX-x);
  var spd=Math.max(0.2,0.9-size*0.005);
  fishes.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,size:size,species:sp,colorIdx:Math.floor(Math.random()*sp.colors.length),turnTimer:120+Math.random()*240});
}
function mathrand(n){var s=Math.random()*n;return s<10?10+n+s*0.5:s}

// 渐进生成：根据玩家体型决定鱼群数量
function maintainFish(){
  var target=player.size<25?3:player.size<50?5:player.size<90?7:9;
  spawnTimer--;
  if(fishes.length<target && spawnTimer<=0){
    spawnFish();
    spawnTimer=Math.max(35,70-fishes.length*4);
  }
}

// ===== 粒子系统 =====
var particles=[];
function emitParticles(x,y,color,count){
  for(var i=0;i<count;i++){
    var angle=Math.random()*Math.PI*2;
    var speed=2+Math.random()*4;
    var life=20+Math.random()*20;
    particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:life,maxLife:life,radius:2+Math.random()*4,color:color});
  }
}

// ===== 输入处理 =====
var keys={};
var touchActive=false,touchX=0,touchY=0,lastTouchX=0,lastTouchY=0;

document.addEventListener("keydown",function(e){keys[e.key]=true;e.preventDefault()});
document.addEventListener("keyup",function(e){keys[e.key]=false});

c.addEventListener("touchstart",function(e){
  e.preventDefault();
  var t=e.touches[0];
  touchActive=true;touchX=t.clientX;touchY=t.clientY;
  lastTouchX=t.clientX;lastTouchY=t.clientY;
},{passive:false});
c.addEventListener("touchmove",function(e){
  e.preventDefault();
  var t=e.touches[0];
  lastTouchX=touchX;lastTouchY=touchY;
  touchX=t.clientX;touchY=t.clientY;
},{passive:false});
c.addEventListener("touchend",function(e){touchActive=false});

var mouseDown=false,mouseX=0,mouseY=0;
c.addEventListener("mousedown",function(e){mouseDown=true;mouseX=e.clientX;mouseY=e.clientY});
c.addEventListener("mousemove",function(e){if(mouseDown){mouseX=e.clientX;mouseY=e.clientY}});
c.addEventListener("mouseup",function(e){mouseDown=false});

// ===== 绘图 =====
function drawFishGeneric(x,y,size,species,colorIdx,d){
  var colors=species.colors;
  var fill=colors[colorIdx];
  var accent=colors[(colorIdx+1)%colors.length];
  species.draw(x,y,size,fill,accent,d);
}

function drawBackground(){
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0a4a7a");
  grad.addColorStop(0.5,"#0e5e8a");
  grad.addColorStop(1,"#062840");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(40,120,80,0.3)";ctx.lineWidth=2;
  for(var i=0;i<W;i+=50+Math.random()*40){
    var hh=30+Math.random()*60;
    ctx.beginPath();ctx.moveTo(i,H);ctx.quadraticCurveTo(i+20-Math.random()*40,H-hh*0.7,i+15-Math.random()*30,H-hh);ctx.stroke();
  }
  if(!window.__lightRays){window.__lightRays=[];for(var ii=0;ii<4;ii++){window.__lightRays.push({x:W*0.1+Math.random()*W*0.8,w:30+Math.random()*40})}}
  for(var i=0;i<window.__lightRays.length;i++){
    var lr=window.__lightRays[i];
    var grad2=ctx.createLinearGradient(lr.x,0,lr.x+lr.w,H);
    grad2.addColorStop(0,"rgba(255,255,255,0.04)");grad2.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=grad2;ctx.fillRect(lr.x,0,lr.w,H);
  }
}

// ===== 更新 =====
function update(){
  var tx=0,ty=0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"])tx-=1;
  if(keys["ArrowRight"]||keys["d"]||keys["D"])tx+=1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"])ty-=1;
  if(keys["ArrowDown"]||keys["s"]||keys["S"])ty+=1;
  if(touchActive){
    var dtouchX=touchX-lastTouchX,dtouchY=touchY-lastTouchY;
    var tdist=Math.sqrt(dtouchX*dtouchX+dtouchY*dtouchY);
    if(tdist>1){tx=dtouchX/tdist;ty=dtouchY/tdist}
  }
  if(mouseDown){
    var dx=mouseX-player.x,dy=mouseY-player.y;
    var dist=Math.sqrt(dx*dx+dy*dy);if(dist>10){tx=dx/dist;ty=dy/dist}
  }
  var accel=0.08,maxSpeed=2.2+player.size*0.002;
  if(tx||ty){player.vx+=tx*accel;player.vy+=ty*accel;}
  else{player.vx*=0.93;player.vy*=0.93}
  var spd=Math.sqrt(player.vx*player.vx+player.vy*player.vy);
  if(spd>maxSpeed){player.vx=player.vx/spd*maxSpeed;player.vy=player.vy/spd*maxSpeed}
  player.x+=player.vx;player.y+=player.vy;
  if(player.x<-player.size*2)player.x=W+player.size;
  if(player.x>W+player.size*2)player.x=-player.size;
  if(player.y<-player.size*2)player.y=H+player.size;
  if(player.y>H+player.size*2)player.y=-player.size;

  if(player.invincible>0)player.invincible--;

  maintainFish();

  // NPC 移动
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];
    f.x+=f.vx;f.y+=f.vy;f.turnTimer--;
    if(f.turnTimer<=0){
      f.turnTimer=120+Math.random()*240;
      var ang=Math.atan2(f.vy,f.vx)+(Math.random()-0.5)*1.5;
      var s=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
      f.vx=Math.cos(ang)*s;f.vy=Math.sin(ang)*s;
    }
    // 远处超出画面后回收
    var marg=Math.max(f.size*5,200);
    if(f.x<-marg||f.x>W+marg||f.y<-marg||f.y>H+marg){fishes.splice(i,1)}
  }

  // 碰撞
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];
    var dx=player.x-f.x,dy=player.y-f.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<(player.size+f.size)*0.7){
      if(player.size>f.size*1.2){
        player.grow(f.size*0.18);
        player.score+=Math.floor(f.size);
        emitParticles(f.x,f.y,speciesColor(f),10);
        fishes.splice(i,1);
      }else if(player.size<f.size*0.95 && player.invincible<=0){
        player.lives--;player.invincible=120;player.vx=0;player.vy=0;
        emitParticles(player.x,player.y,"#ff0",20);
        if(player.lives<=0)gameOver();
      }
    }
  }

  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}
  document.getElementById("score").textContent="🐟 "+player.score;
  document.getElementById("size").textContent="📏 "+Math.floor(player.size);
  var hearts="";for(var i=0;i<3;i++)hearts+=(i<player.lives?"❤️":"🖤");
  document.getElementById("lives").textContent=hearts;
}
function speciesColor(f){return f.species.colors[f.colorIdx]}

// ===== 渲染 =====
function render(){
  drawBackground();
  var sorted=fishes.slice().sort(function(a,b){return a.size-b.size});
  for(var i=0;i<sorted.length;i++){
    var f=sorted[i];
    var dir=Math.atan2(f.vy,f.vx);
    drawFishGeneric(f.x,f.y,f.size,f.species,f.colorIdx,dir);
  }
  if(player.invincible<=0||Math.floor(player.invincible/4)%2===0){
    var pdir=player.vx||player.vy?Math.atan2(player.vy,player.vx):0;
    ctx.save();ctx.translate(player.x,player.y);
    ctx.shadowColor="rgba(255,107,107,0.5)";ctx.shadowBlur=player.size*0.5;
    ctx.translate(-player.x,-player.y);
    drawFishGeneric(player.x,player.y,player.size,{colors:["#ff6b6b","#ff8e8e"],draw:drawBass},0,pdir);
    ctx.restore();
  }
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius*p.life/p.maxLife,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,"+(p.life/p.maxLife)+")";ctx.fill();
  }
  // 大鱼红色虚线警示
  for(var i=0;i<sorted.length;i++){
    var f=sorted[i];
    if(f.size>player.size){
      ctx.beginPath();ctx.arc(f.x,f.y,f.size*1.15,0,Math.PI*2);
      ctx.setLineDash([4,6]);ctx.strokeStyle="rgba(255,60,60,0.35)";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
    }
  }
}

var running=true;
function gameOver(){
  running=false;
  var el=document.getElementById("msg");
  el.innerHTML='<div>🦈 被大鱼吃了！</div><div style="font-size:18px;margin-top:8px;opacity:0.8">最终得分：'+player.score+' · 体型：'+Math.floor(player.size)+'</div><button onclick="location.reload()">🔄 再来一局</button>';
  el.style.opacity="1";
}

function init(){
  player.x=W/2;player.y=H/2;player.size=20;player.score=0;player.lives=3;player.invincible=60;
  fishes=[];particles=[];spawnTimer=5;
  // 开局只放 3 条小鱼在边缘附近
  for(var i=0;i<2;i++){var sp=getAvailableSpecies()[0];var size=sp.minSize+Math.random()*(sp.maxSize-sp.minSize*0.6);var ang=Math.random()*Math.PI*2;var spd=Math.max(0.2,0.9-size*0.005);var margin=80;var side=Math.floor(Math.random()*4);var sx,sy;if(side===0){sx=-margin-mathrand(size*2);sy=Math.random()*H}else if(side===1){sx=W+margin+mathrand(size*2);sy=Math.random()*H}else if(side===2){sx=Math.random()*W;sy=-margin-mathrand(size*2)}else{sx=Math.random()*W;sy=H+margin+mathrand(size*2)};fishes.push({x:sx,y:sy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,size:size,species:sp,colorIdx:Math.floor(Math.random()*sp.colors.length),turnTimer:120+Math.random()*240})}
}

function loop(){if(running)update();render();requestAnimationFrame(loop)}
init();loop();
})();
</script>
</body>
