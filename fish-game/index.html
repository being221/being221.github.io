<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐟 大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02101c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;z-index:10;display:flex;gap:10px;pointer-events:none}
#ui span{background:rgba(0,0,0,0.55);color:#fff;padding:7px 16px;border-radius:20px;font-size:14px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08)}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-size:30px;text-align:center;pointer-events:none;text-shadow:0 3px 15px rgba(0,0,0,0.6)}
#msg button{pointer-events:auto;margin-top:18px;padding:14px 40px;border:none;border-radius:28px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;font-size:20px;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(255,107,107,0.4)}
#msg button:active{transform:scale(0.94)}
</style>
</head>
<body><canvas id="c"></canvas>
<div id="ui"><span>🐟 <b id="score">0</b></span><span>📏 <b id="size">20</b></span><span id="lives">❤️❤️❤️</span></div>
<div id="msg"></div>
<script>
(function(){
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,T=0;
resize();window.addEventListener("resize",resize);
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}

// ===== 缓存的背景数据 =====
var weedData=[],stoneData=[],bubbleData=[];
for(var i=0;i<35;i++)weedData.push({x:Math.random()*3000,hp:60+Math.random()*160,w:2+Math.random()*3,sk:Math.random()*20-10,c:"rgba("+(18+Math.random()*10)+","+(60+Math.random()*25)+","+(38+Math.random()*12)+",0.4)"});
for(var i=0;i<22;i++)stoneData.push({x:Math.random()*3000,y:Math.random()*80,rx:15+Math.random()*30,ry:6+Math.random()*10,c:"rgba("+(10+Math.random()*12)+","+(22+Math.random()*15)+","+(16+Math.random()*10)+",0.5)"});
for(var i=0;i<70;i++)bubbleData.push({x:Math.random()*3000,y:Math.random()*3000,r:1+Math.random()*5,s:0.08+Math.random()*0.25,o:0.02+Math.random()*0.06});

// ===== 鱼种（内联绘制函数）=====
function B(x,y,w,h,fc,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fillStyle=fc;ctx.fill();ctx.restore()}
function E(x,y,s,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.arc(s*0.65,-s*0.1,s*0.22,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.beginPath();ctx.arc(s*0.75,-s*0.08,s*0.11,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();ctx.restore()}
function T(x,y,p1,p2,p3,clr,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p3[0],p3[1]);ctx.closePath();ctx.fillStyle=clr;ctx.fill();ctx.restore()}

var SPECIES=[
  {t:0,min:3,max:10,c:["#7ec8e3","#8ec5d6","#6ab0c8"],d:function(x,y,s,c,a,d){B(x,y,s*1.3,s*0.48,a,d);T(x,y,[-s*0.9,0],[-s*1.7,-s*0.55],[-s*1.7,s*0.55],c,d);E(x,y,s,d)}},
  {t:0,min:4,max:12,c:["#ff9aa2","#ffb347","#ff6f91"],d:function(x,y,s,c,a,d){B(x,y,s*0.9,s*0.7,a,d);T(x,y,[-s*0.8,0],[-s*1.8,-s*1.1],[-s*1.4,-s*0.6],c,d);E(x,y,s,d)}},
  {t:0,min:5,max:14,c:["#00bcd4","#009688","#26c6da"],d:function(x,y,s,c,a,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(s*1.1,0);ctx.quadraticCurveTo(0,-s*1.1,-s*0.9,0);ctx.quadraticCurveTo(0,s*1.1,s*1.1,0);ctx.fillStyle=a;ctx.fill();ctx.restore();T(x,y,[-s*0.8,0],[-s*1.4,-s*0.4],[-s*1.4,s*0.4],c,d);E(x,y,s,d)}},
  {t:1,min:12,max:28,c:["#ff6f00","#e65100","#ff8f00"],d:function(x,y,s,c,a,d){B(x,y,s*1.05,s*0.7,c,d);T(x,y,[-s*1.0,0],[-s*1.7,-s*0.55],[-s*1.7,s*0.55],a,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.ellipse(s*0.25,0,s*0.1,s*0.7,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.beginPath();ctx.ellipse(-s*0.3,0,s*0.1,s*0.7,0,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.restore();E(x,y,s,d)}},
  {t:1,min:15,max:35,c:["#ce93d8","#ba68c8","#ab47bc"],d:function(x,y,s,c,a,d){B(x,y,s*0.6,s*1.5,a,d);T(x,y,[-s*0.7,0],[-s*1.3,-s*0.35],[-s*1.3,s*0.35],c,d);E(x,y,s*0.8,d)}},
  {t:1,min:14,max:30,c:["#a5d6a7","#81c784","#66bb6a"],d:function(x,y,s,c,a,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.arc(0,0,s*0.85,0,Math.PI*2);ctx.fillStyle=a;ctx.fill();for(var i=0;i<10;i++){var an=i/10*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(an)*s*0.75,Math.sin(an)*s*0.75);ctx.lineTo(Math.cos(an)*s*1,Math.sin(an)*s*1);ctx.strokeStyle="rgba(0,0,0,0.08)";ctx.lineWidth=1;ctx.stroke()}ctx.restore();T(x,y,[-s*0.8,0],[-s*1.2,-s*0.3],[-s*1.2,s*0.3],c,d);E(x,y,s*0.9,d)}},
  {t:2,min:25,max:55,c:["#8d6e63","#795548","#a1887f"],d:function(x,y,s,c,a,d){B(x,y,s*1.2,s*0.65,a,d);T(x,y,[-s*1.1,0],[-s*1.8,-s*0.6],[-s*1.8,s*0.6],c,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.3);ctx.quadraticCurveTo(0,-s*0.05,s*0.8,-s*0.2);ctx.strokeStyle="rgba(0,0,0,0.12)";ctx.lineWidth=1.5;ctx.stroke();ctx.restore();E(x,y,s,d)}},
  {t:2,min:30,max:60,c:["#ef5350","#e57373","#f44336"],d:function(x,y,s,c,a,d){B(x,y,s*1.3,s*0.6,a,d);T(x,y,[-s*1.0,0],[-s*1.9,-s*0.7],[-s*1.3,-s*0.4],c,d);E(x,y,s,d)}},
  {t:2,min:25,max:50,c:["#78909c","#90a4ae","#607d8b"],d:function(x,y,s,c,a,d){B(x,y,s*1.1,s*0.55,a,d);T(x,y,[-s*1.0,0],[-s*1.6,-s*0.5],[-s*1.6,s*0.5],c,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(s*1.0,-s*0.3);ctx.quadraticCurveTo(s*1.8,-s*1.5,s*1.2,-s*2);ctx.strokeStyle=c;ctx.lineWidth=s*0.07;ctx.stroke();ctx.beginPath();ctx.moveTo(s*1.0,s*0.3);ctx.quadraticCurveTo(s*1.8,s*1.5,s*1.2,s*2);ctx.stroke();ctx.restore();E(x,y,s,d)}},
  {t:3,min:45,max:100,c:["#6b7b8d","#8e9eab","#546e7a"],d:function(x,y,s,c,a,d){B(x,y,s*1.4,s*0.6,a,d);ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.moveTo(-s*0.2,-s*0.5);ctx.lineTo(s*0.2,-s*2);ctx.lineTo(s*0.5,-s*0.5);ctx.fillStyle=c;ctx.fill();ctx.restore();T(x,y,[-s*1.0,-s*0.2],[-s*1.8,-s*1],[-s*1.5,0],c,d);T(x,y,[-s*1.0,s*0.2],[-s*1.8,s*1],[-s*1.5,0],c,d);E(x,y,s,d)}},
  {t:3,min:50,max:110,c:["#3949ab","#1e88e5","#1565c0"],d:function(x,y,s,c,a,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(s*1.3,0);ctx.bezierCurveTo(s*0.6,-s*0.8,-s*0.3,-s*0.9,-s*0.9,-s*0.3);ctx.bezierCurveTo(-s*1.4,s*0.1,-s*0.8,s*0.7,0,s*0.6);ctx.bezierCurveTo(s*0.4,s*0.5,s*0.8,s*0.3,s*1.3,0);ctx.closePath();ctx.fillStyle=a;ctx.fill();ctx.restore();T(x,y,[-s*1.0,0],[-s*1.8,-s*0.5],[-s*1.2,-s*0.3],c,d);E(x,y,s,d)}},
  {t:3,min:40,max:85,c:["#546e7a","#455a64","#37474f"],d:function(x,y,s,c,a,d){ctx.save();ctx.translate(x,y);ctx.rotate(d);ctx.beginPath();ctx.moveTo(s*1.2,0);ctx.quadraticCurveTo(s*0.6,-s*2,-0.1,-s*2.5);ctx.quadraticCurveTo(-s*0.3,-s*2.2,-s*0.4,-s*1.2);ctx.lineTo(-s*0.4,s*1.2);ctx.quadraticCurveTo(-s*0.3,s*2.2,-0.1,s*2.5);ctx.quadraticCurveTo(s*0.6,s*2,s*1.2,0);ctx.closePath();ctx.fillStyle=a;ctx.fill();ctx.restore();E(x,y,s*0.7,d)}},
];

function drawPlayerFish(x,y,s,d){ctx.save();ctx.translate(x,y);ctx.shadowColor="rgba(255,150,100,0.5)";ctx.shadowBlur=s*0.5;ctx.rotate(d);B(0,0,s*1.2,s*0.65,"#ff8e8e",0);T(0,0,[-s*1.1,0],[-s*1.8,-s*0.6],[-s*1.8,s*0.6],"#ff6b6b",0);ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.3);ctx.quadraticCurveTo(0,-s*0.05,s*0.8,-s*0.2);ctx.strokeStyle="rgba(0,0,0,0.12)";ctx.lineWidth=1.5;ctx.stroke();E(0,0,s,0);ctx.restore()}

function avail(){var t=player.sz<25?0:player.sz<50?1:player.sz<90?2:3;return SPECIES.filter(function(s){return s.t<=t})}

// ===== 游戏状态 =====
var player={x:0,y:0,sz:20,score:0,lives:3,inv:0,vx:0,vy:0};
var fishes=[],spawnCD=0,parts=[];

function spawnFish(){
  var as=avail(),sp=as[Math.floor(Math.random()*as.length)];
  var bs=Math.random()<0.15?player.sz*(0.5+Math.random()*0.4):player.sz*(1.2+Math.random()*2);
  var s=Math.max(sp.min,Math.min(sp.max,bs));
  var side=Math.floor(Math.random()*4),x,y,m=s*2+20;
  if(side===0){x=-m;y=Math.random()*H}else if(side===1){x=W+m;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=-m}else{x=Math.random()*W;y=H+m}
  var tx=W/2+(Math.random()-0.5)*W*0.7,ty=H/2+(Math.random()-0.5)*H*0.7;
  var ang=Math.atan2(ty-y,tx-x),spd=Math.max(0.08,0.4-s*0.0015);
  fishes.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,sz:s,sp:sp,cid:0,tt:120+Math.random()*200});
}
function burst(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:20+Math.random()*30,m:20+Math.random()*30,r:1+Math.random()*3,c:c})}}

// ===== 输入 =====
var keys={},ta=false,tx=0,ty=0,ltx=0,lty=0;
document.addEventListener("keydown",function(e){keys[e.key]=true;e.preventDefault()});
document.addEventListener("keyup",function(e){keys[e.key]=false});
c.addEventListener("touchstart",function(e){e.preventDefault();var t=e.touches[0];ta=true;tx=t.clientX;ty=t.clientY;ltx=tx;lty=ty},{passive:false});
c.addEventListener("touchmove",function(e){e.preventDefault();var t=e.touches[0];ltx=tx;lty=ty;tx=t.clientX;ty=t.clientY},{passive:false});
c.addEventListener("touchend",function(){ta=false});
var md=false,mx=0,my=0;
c.addEventListener("mousedown",function(e){md=true;mx=e.clientX;my=e.clientY});
c.addEventListener("mousemove",function(e){if(md){mx=e.clientX;my=e.clientY}});
c.addEventListener("mouseup",function(){md=false});

// ===== 主循环 =====
function update(){
  T++;
  var ux=0,uy=0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"])ux-=1;if(keys["ArrowRight"]||keys["d"]||keys["D"])ux+=1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"])uy-=1;if(keys["ArrowDown"]||keys["s"]||keys["S"])uy+=1;
  if(ta){var dx=tx-ltx,dy=ty-lty;var d=Math.sqrt(dx*dx+dy*dy);if(d>1){ux=dx/d;uy=dy/d}}
  if(md){var dmx=mx-player.x,dmy=my-player.y;var dm=Math.sqrt(dmx*dmx+dmy*dmy);if(dm>10){ux=dmx/dm;uy=dmy/dm}}
  var acc=0.04,max=1.2+player.sz*0.001;
  if(ux||uy){player.vx+=ux*acc;player.vy+=uy*acc}else{player.vx*=0.93;player.vy*=0.93}
  var sp=Math.sqrt(player.vx*player.vx+player.vy*player.vy);if(sp>max){player.vx=player.vx/sp*max;player.vy=player.vy/sp*max}
  player.x+=player.vx;player.y+=player.vy;
  if(player.x<player.sz){player.x=player.sz;player.vx=Math.abs(player.vx)*0.3}
  if(player.x>W-player.sz){player.x=W-player.sz;player.vx=-Math.abs(player.vx)*0.3}
  if(player.y<player.sz){player.y=player.sz;player.vy=Math.abs(player.vy)*0.3}
  if(player.y>H-player.sz){player.y=H-player.sz;player.vy=-Math.abs(player.vy)*0.3}
  if(player.inv>0)player.inv--;

  var target=player.sz<25?4:player.sz<50?6:player.sz<90?8:10;
  spawnCD--;if(fishes.length<target&&spawnCD<=0){spawnFish();spawnCD=Math.max(35,75-fishes.length*4)}

  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];f.x+=f.vx;f.y+=f.vy;f.tt--;
    var dpx=player.x-f.x,dpy=player.y-f.y,dpv=Math.sqrt(dpx*dpx+dpy*dpy);
    if(f.tt<=0){f.tt=100+Math.random()*160;
      var ang;
      if(f.sz>player.sz*1.2&&dpv<W*0.5&&Math.random()<0.4) ang=Math.atan2(dpy,dpx)+(Math.random()-0.5)*0.3;
      else if(f.sz<player.sz*0.6&&dpv<90&&Math.random()<0.3) ang=Math.atan2(dpy,dpx)+Math.PI+(Math.random()-0.5)*0.6;
      else ang=Math.atan2(f.vy,f.vx)+(Math.random()-0.5)*1.5;
      var s2=Math.sqrt(f.vx*f.vx+f.vy*f.vy);f.vx=Math.cos(ang)*s2;f.vy=Math.sin(ang)*s2;
    }
    var m2=Math.max(f.sz*2,40);
    if(f.x<m2){f.x=m2;f.vx=Math.abs(f.vx)}if(f.x>W-m2){f.x=W-m2;f.vx=-Math.abs(f.vx)}
    if(f.y<m2){f.y=m2;f.vy=Math.abs(f.vy)}if(f.y>H-m2){f.y=H-m2;f.vy=-Math.abs(f.vy)}
    if(f.x<-500||f.x>W+500||f.y<-500||f.y>H+500)fishes.splice(i,1);
  }
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i],dx=player.x-f.x,dy=player.y-f.y,dd=Math.sqrt(dx*dx+dy*dy);
    if(dd<(player.sz+f.sz)*0.65){
      if(player.sz>f.sz*1.2){player.sz+=player.sz*0.03;if(player.sz>220)player.sz=220;player.score+=Math.floor(f.sz);burst(f.x,f.y,f.sp.c[f.cid],6);fishes.splice(i,1)}
      else if(player.sz<f.sz*0.9&&player.inv<=0){player.lives--;player.inv=150;player.vx=0;player.vy=0;burst(player.x,player.y,"#ff4444",25);if(player.lives<=0)gameOver()}
    }
  }
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)parts.splice(i,1)}
  document.getElementById("score").textContent=player.score;document.getElementById("size").textContent=Math.floor(player.sz);
  var hh="";for(var i=0;i<3;i++)hh+=(i<player.lives?"❤️":"🖤");document.getElementById("lives").textContent=hh;
}

function render(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#062a4a");g.addColorStop(0.5,"#084e70");g.addColorStop(1,"#02182a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(20,40,35,0.35)";ctx.fillRect(0,H-35,W,35);
  for(var i=0;i<stoneData.length;i++){var st=stoneData[i];ctx.beginPath();ctx.ellipse(st.x,H-st.y,st.rx,st.ry,0,0,Math.PI*2);ctx.fillStyle=st.c;ctx.fill()}
  ctx.lineCap="round";
  for(var i=0;i<weedData.length;i++){var sw=weedData[i];ctx.beginPath();ctx.moveTo(sw.x,H);ctx.bezierCurveTo(sw.x+sw.sk*0.5,H-sw.hp*0.35,sw.x+sw.sk,H-sw.hp*0.7,sw.x+sw.sk*0.3,H-sw.hp);ctx.strokeStyle=sw.c;ctx.lineWidth=sw.w;ctx.stroke();ctx.beginPath();ctx.moveTo(sw.x+1,H);ctx.bezierCurveTo(sw.x+sw.sk*0.5+1,H-sw.hp*0.35,sw.x+sw.sk+1,H-sw.hp*0.7,sw.x+sw.sk*0.3+1,H-sw.hp);ctx.strokeStyle="rgba(8,35,20,0.22)";ctx.lineWidth=sw.w*0.4;ctx.stroke()}
  ctx.globalAlpha=0.025;
  for(var i=0;i<4;i++){var lx=W*0.15+i*W*0.22;var g2=ctx.createLinearGradient(lx,0,lx+22,H);g2.addColorStop(0,"#fff");g2.addColorStop(1,"transparent");ctx.fillStyle=g2;ctx.fillRect(lx,0,16,H)}
  ctx.globalAlpha=1;
  for(var i=0;i<bubbleData.length;i++){var b=bubbleData[i];b.y-=b.s;if(b.y<-20){b.y=H+10;b.x=Math.random()*W}b.x+=Math.sin(T*0.01+b.y*0.006)*0.15;var bx=b.x;while(bx<0)bx+=W;while(bx>W)bx-=W;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,Math.PI*2);ctx.strokeStyle="rgba(255,255,255,"+b.o+")";ctx.lineWidth=0.6;ctx.stroke()}
  var sorted=fishes.slice().sort(function(a,b){return a.sz-b.sz});
  for(var i=0;i<sorted.length;i++){var f=sorted[i],dir=Math.atan2(f.vy,f.vx);f.sp.d(f.x,f.y,f.sz,f.sp.c[f.cid],f.sp.c[(f.cid+1)%f.sp.c.length],dir)}
  if(player.inv<=0||Math.floor(player.inv/5)%2===0){var pd=player.vx||player.vy?Math.atan2(player.vy,player.vx):0;drawPlayerFish(player.x,player.y,player.sz,pd)}
  for(var i=0;i<parts.length;i++){var p=parts[i];ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l/p.m,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+(p.l/p.m*0.6)+")";ctx.fill()}
  for(var i=0;i<sorted.length;i++){var f2=sorted[i];if(f2.sz>player.sz){ctx.beginPath();ctx.arc(f2.x,f2.y,f2.sz*1.15,0,Math.PI*2);ctx.setLineDash([4,8]);ctx.strokeStyle="rgba(255,50,50,0.25)";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])}}
}

var running=true;
function gameOver(){running=false;document.getElementById("msg").innerHTML='<div>🦈 被大鱼吃了！</div><div style="font-size:18px;margin-top:8px;opacity:0.8">得分：'+player.score+' · 体型：'+Math.floor(player.sz)+'</div><button onclick="location.reload()">🔄 再来一局</button>'}
function init(){
  player.x=W/2;player.y=H/2;player.sz=20;player.score=0;player.lives=3;player.inv=90;fishes=[];parts=[];spawnCD=10;
  for(var i=0;i<2;i++){var as=avail(),sp=as[Math.floor(Math.random()*as.length)],s=sp.min+Math.random()*5,ang=Math.PI*2/2*i;fishes.push({x:W/2+Math.cos(ang)*120,y:H/2+Math.sin(ang)*120,vx:Math.cos(ang+1)*0.3,vy:Math.sin(ang+1)*0.3,sz:s,sp:sp,cid:0,tt:150})}
}
function loop(){try{if(running)update();render()}catch(e){console.warn('game error:',e)}requestAnimationFrame(loop)}
init();loop();
})();
</script>
