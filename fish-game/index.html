<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐟 大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block;margin:0 auto}
#ui{position:fixed;top:10px;left:10px;z-index:10;display:flex;gap:16px;pointer-events:none}
#ui span{background:rgba(0,0,0,0.5);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;backdrop-filter:blur(4px)}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-size:28px;text-align:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,0.5);transition:opacity 0.3s}
#msg button{pointer-events:auto;margin-top:16px;padding:12px 32px;border:none;border-radius:24px;background:#ff6b6b;color:#fff;font-size:18px;cursor:pointer;font-family:inherit;transition:transform 0.15s}
#msg button:active{transform:scale(0.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span id="score">🐟 0</span>
  <span id="size">📏 20</span>
  <span id="lives">❤️❤️❤️</span>
</div>
<div id="msg"></div>
<script>
(function(){
var c=document.getElementById("c"),ctx=c.getContext("2d");
var W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
resize();window.addEventListener("resize",resize);

// ===== 玩家 =====
var player={
  x:0,y:0,size:20,score:0,lives:3,invincible:0,
  vx:0,vy:0,
  color:"#ff6b6b",
  bodyColor:"#ff8e8e",
  grow:function(amt){this.size+=amt;if(this.size>200)this.size=200}
};

// ===== NPC 鱼 =====
var fishes=[];
function spawnFish(){
  var maxSize=Math.max(player.size*2.8, 40);
  var minSize=3;
  var size=minSize+Math.random()*(maxSize-minSize);
  // 从边沿生成
  var side=Math.floor(Math.random()*4);
  var x,y;
  if(side===0){x=-size*3;y=Math.random()*H}
  else if(side===1){x=W+size*3;y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=-size*3}
  else{x=Math.random()*W;y=H+size*3}
  var angle=Math.random()*Math.PI*2;
  var speed=1.5+Math.random()*2.5;
  // 大鱼慢一点，小鱼快一点
  var spd=Math.max(0.5, 3-size*0.02);
  var hue=(size<player.size)?[30,120][Math.floor(Math.random()*2)]:[180,360][Math.floor(Math.random()*2)];
  var sat=60+Math.random()*30;
  var lit=45+Math.random()*25;
  fishes.push({
    x:x,y:y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
    size:size,
    color:"hsl("+hue+","+sat+"%,"+lit+"%)",
    bodyColor:"hsl("+hue+","+(sat-10)+"%,"+(lit+10)+"%)",
    tailPhase:Math.random()*Math.PI*2,
    turnTimer:60+Math.random()*180
  });
}

// 保持 15-20 条鱼
function maintainFish(){
  var target=15+Math.floor(Math.random()*6);
  while(fishes.length<target)spawnFish();
}

// ===== 粒子系统 =====
var particles=[];
function emitParticles(x,y,color,count){
  for(var i=0;i<count;i++){
    var angle=Math.random()*Math.PI*2;
    var speed=2+Math.random()*4;
    var life=20+Math.random()*20;
    particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:life,maxLife:life,radius:2+Math.random()*4,color:color});
  }
}

// ===== 输入处理 =====
var keys={};
var touchActive=false,touchX=0,touchY=0;

document.addEventListener("keydown",function(e){keys[e.key]=true;e.preventDefault()});
document.addEventListener("keyup",function(e){keys[e.key]=false});

c.addEventListener("touchstart",function(e){
  e.preventDefault();
  var t=e.touches[0];
  touchActive=true;touchX=t.clientX;touchY=t.clientY;
},{passive:false});
c.addEventListener("touchmove",function(e){
  e.preventDefault();
  var t=e.touches[0];
  touchX=t.clientX;touchY=t.clientY;
},{passive:false});
c.addEventListener("touchend",function(e){
  touchActive=false;
});

// 鼠标（电脑上用点击+拖动）
var mouseDown=false,mouseX=0,mouseY=0;
c.addEventListener("mousedown",function(e){mouseDown=true;mouseX=e.clientX;mouseY=e.clientY});
c.addEventListener("mousemove",function(e){if(mouseDown){mouseX=e.clientX;mouseY=e.clientY}});
c.addEventListener("mouseup",function(e){mouseDown=false});

// ===== 绘图函数 =====
function drawFish(x,y,size,color,bodyColor,direction){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(direction);
  var s=size;
  // 身体（椭圆）
  ctx.beginPath();
  ctx.ellipse(0,0,s*1.1,s*0.6,0,0,Math.PI*2);
  ctx.fillStyle=bodyColor;
  ctx.fill();
  // 身体纹理
  ctx.beginPath();
  ctx.ellipse(0,s*0.15,s*0.8,s*0.35,0,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.15)";
  ctx.fill();
  // 尾部
  ctx.beginPath();
  ctx.moveTo(-s*1.1,0);
  ctx.lineTo(-s*1.8,-s*0.55);
  ctx.lineTo(-s*1.8,s*0.55);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
  // 背鳍
  ctx.beginPath();
  ctx.moveTo(s*0.2,-s*0.5);
  ctx.quadraticCurveTo(-s*0.2,-s*1.5,-s*0.6,-s*0.5);
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fill();
  // 眼睛
  ctx.beginPath();
  ctx.arc(s*0.65,-s*0.1,s*0.22,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s*0.75,-s*0.08,s*0.11,0,Math.PI*2);
  ctx.fillStyle="#111";
  ctx.fill();
  ctx.restore();
}

function drawBackground(){
  // 池塘渐变
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0a4a7a");
  grad.addColorStop(0.5,"#0e5e8a");
  grad.addColorStop(1,"#062840");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  // 底部水草
  ctx.strokeStyle="rgba(40,120,80,0.3)";
  ctx.lineWidth=2;
  for(var i=0;i<W;i+=50+Math.random()*40){
    var h=30+Math.random()*60;
    ctx.beginPath();
    ctx.moveTo(i,H);
    ctx.quadraticCurveTo(i+20-Math.random()*40,H-h*0.7,i+15-Math.random()*30,H-h);
    ctx.stroke();
  }
  // 光线
  for(var i=0;i<4;i++){
    var gx=W*0.1+Math.random()*W*0.8;
    var grad2=ctx.createLinearGradient(gx,0,gx+40,H);
    grad2.addColorStop(0,"rgba(255,255,255,0.04)");
    grad2.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=grad2;
    ctx.fillRect(gx,0,30+Math.random()*40,H);
  }
}

// ===== 更新 =====
function update(){
  // 输入 → 目标方向
  var tx=0,ty=0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"])tx-=1;
  if(keys["ArrowRight"]||keys["d"]||keys["D"])tx+=1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"])ty-=1;
  if(keys["ArrowDown"]||keys["s"]||keys["S"])ty+=1;

  if(touchActive){
    var dx=touchX-player.x,dy=touchY-player.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>10){tx=dx/dist;ty=dy/dist}
  }
  if(mouseDown){
    var dx=mouseX-player.x,dy=mouseY-player.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>10){tx=dx/dist;ty=dy/dist}
  }

  // 平滑加速
  var accel=0.15;
  var maxSpeed=4+player.size*0.02;
  if(tx!==0||ty!==0){
    player.vx+=tx*accel;player.vy+=ty*accel;
  }else{
    player.vx*=0.95;player.vy*=0.95;
  }
  var spd=Math.sqrt(player.vx*player.vx+player.vy*player.vy);
  if(spd>maxSpeed){player.vx=player.vx/spd*maxSpeed;player.vy=player.vy/spd*maxSpeed}

  // 移动玩家
  player.x+=player.vx;player.y+=player.vy;
  // 屏幕边界
  if(player.x<-player.size*2)player.x=W+player.size;
  if(player.x>W+player.size*2)player.x=-player.size;
  if(player.y<-player.size*2)player.y=H+player.size;
  if(player.y>H+player.size*2)player.y=-player.size;

  // 无敌时间
  if(player.invincible>0)player.invincible--;

  // 移动 NPC
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];
    f.x+=f.vx;f.y+=f.vy;
    f.turnTimer--;
    if(f.turnTimer<=0){
      f.turnTimer=60+Math.random()*180;
      var ang=Math.atan2(f.vy,f.vx)+(Math.random()-0.5)*1.5;
      var sp=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
      f.vx=Math.cos(ang)*sp;f.vy=Math.sin(ang)*sp;
    }
    // 边界反弹
    if(f.x<-f.size*2 || f.x>W+f.size*2 || f.y<-f.size*2 || f.y>H+f.size*2){
      // 移除并重生
      fishes.splice(i,1);
    }
  }

  maintainFish();

  // 碰撞检测
  for(var i=fishes.length-1;i>=0;i--){
    var f=fishes[i];
    var dx=player.x-f.x,dy=player.y-f.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var collisionDist=(player.size+f.size)*0.7;
    if(dist<collisionDist){
      if(player.size>f.size*1.05){
        // 吃掉
        player.grow(f.size*0.42);
        player.score+=Math.floor(f.size);
        emitParticles(f.x,f.y,f.color,12);
        fishes.splice(i,1);
      }else if(player.size<f.size*0.95 && player.invincible<=0){
        // 被吃
        player.lives--;
        player.invincible=120; // 2秒无敌
        player.vx=0;player.vy=0;
        emitParticles(player.x,player.y,"#ff0",20);
        if(player.lives<=0)gameOver();
      }
    }
  }

  // 粒子
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // UI
  document.getElementById("score").textContent="🐟 "+player.score;
  document.getElementById("size").textContent="📏 "+Math.floor(player.size);
  var hearts="";
  for(var i=0;i<3;i++)hearts+=(i<player.lives?"❤️":"🖤");
  document.getElementById("lives").textContent=hearts;
}

// ===== 渲染 =====
function render(){
  drawBackground();

  // NPC 鱼（按大小排序，小的先画）
  var sorted=fishes.slice().sort(function(a,b){return a.size-b.size});
  for(var i=0;i<sorted.length;i++){
    var f=sorted[i];
    var dir=Math.atan2(f.vy,f.vx);
    drawFish(f.x,f.y,f.size,f.color,f.bodyColor,dir);
  }

  // 玩家（无敌时闪烁）
  if(player.invincible<=0 || Math.floor(player.invincible/4)%2===0){
    var pdir=player.vx!==0||player.vy!==0?Math.atan2(player.vy,player.vx):0;
    // 玩家鱼比 NPC 更亮
    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.shadowColor="rgba(255,107,107,0.5)";
    ctx.shadowBlur=player.size*0.5;
    ctx.translate(-player.x,-player.y);
    drawFish(player.x,player.y,player.size,player.color,player.bodyColor,pdir);
    ctx.restore();
  }

  // 粒子
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var alpha=p.life/p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius*alpha,0,Math.PI*2);
    ctx.fillStyle=p.color.replace(")","").replace("hsl","hsla")+","+alpha+")";
    ctx.fill();
  }

  // 比玩家大的鱼有红色标记
  for(var i=0;i<sorted.length;i++){
    var f=sorted[i];
    if(f.size>player.size){
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.size*1.1,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,60,60,0.3)";
      ctx.lineWidth=2;
      ctx.stroke();
    }
  }
}

// ===== 游戏循环 =====
var running=true;

function gameOver(){
  running=false;
  var el=document.getElementById("msg");
  el.innerHTML='<div>🦈 被大鱼吃了！</div><div style="font-size:18px;margin-top:8px;opacity:0.8">最终得分：'+player.score+' · 体型：'+Math.floor(player.size)+'</div><button onclick="location.reload()">🔄 再来一局</button>';
  el.style.opacity="1";
}

function init(){
  player.x=W/2;player.y=H/2;player.size=20;player.score=0;player.lives=3;player.invincible=60;
  fishes=[];particles=[];
  for(var i=0;i<16;i++)spawnFish();
}

function loop(){
  if(running)update();
  render();
  requestAnimationFrame(loop);
}

init();
loop();
})();
</script>
</body>
</html>
