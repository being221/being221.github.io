<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史 · 每日一题</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0f172a; color: #e2e8f0; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,23,42,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0 20px;
}
.nav-inner {
  max-width: 720px; margin: 0 auto; display: flex;
  align-items: center; justify-content: space-between; height: 56px;
}
.nav-brand { font-size: 18px; font-weight: 700; }
.nav-actions { display: flex; align-items: center; gap: 12px; }
.nav-actions a { font-size: 13px; opacity: 0.6; transition: opacity 0.2s; }
.nav-actions a:hover { opacity: 1; }

.container { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
.page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

.history-item {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 20px; margin-bottom: 12px;
  transition: border-color 0.2s;
}
.history-item:hover { border-color: rgba(255,255,255,0.18); }
.history-date { font-size: 12px; color: #64748b; margin-bottom: 6px; }
.history-question { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 4px; }
.history-count { font-size: 12px; color: #475569; }
.empty-state { text-align: center; padding: 60px 20px; color: #475569; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="https://being221.github.io" class="nav-brand">💭 历史问题</a>
    <div class="nav-actions">
      <a href="index.html">← 今日</a>
      <a href="https://being221.github.io">主页</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">📅 历史回顾</h1>
  <div id="historyList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  var sb = window.supabase.createClient(
    "https://codndkieecddabbqhdtg.supabase.co",
    "sb_publishable_wgX79e2z2kgcWKkhmDZIuw_Pd3FCj8E"
  );

  async function loadHistory() {
    var res = await sb.from("daily_question").select("date, question_id").order("date", { ascending: false }).limit(60);
    if (!res.data || res.data.length === 0) {
      document.getElementById("historyList").innerHTML = '<div class="empty-state"><p>还没有历史记录</p></div>';
      return;
    }

    var html = "";
    for (var i = 0; i < res.data.length; i++) {
      var dq = res.data[i];
      var qRes = await sb.from("questions").select("text").eq("id", dq.question_id).single();
      var aRes = await sb.from("answers").select("id", { count: "exact" }).eq("question_id", dq.question_id);
      var count = aRes.count || 0;
      html += '<div class="history-item">' +
        '<p class="history-date">' + dq.date + '</p>' +
        '<p class="history-question">' + (qRes.data ? qRes.data.text : '(已删除)') + '</p>' +
        '<p class="history-count">' + count + ' 个回答</p>' +
      '</div>';
    }
    document.getElementById("historyList").innerHTML = html;
  }

  loadHistory();
})();
</script>
</body>
</html>
