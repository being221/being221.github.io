name: Run Tests

on:
  push:
    branches: [master]
    paths:
      - 'shelf/**'
  pull_request:
    branches: [master]
    paths:
      - 'shelf/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: shelf
        run: npm ci

      - name: Run tests
        working-directory: shelf
        run: npm test
