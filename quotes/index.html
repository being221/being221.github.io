<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格言墙 · QuoteWall</title>
<meta name="description" content="一面可以浏览、投稿、收藏的格言墙。收集打动过你的每一句话。">
<style>
/* 帮助弹窗 */
.hp-btn{position:fixed;top:16px;right:16px;z-index:9999;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.6);color:#fff;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.hp-overlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
.hp-overlay.open{display:flex}
.hp-panel{background:#1a1a2e;border-radius:12px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.5);color:#e0e0e0;position:relative;animation:modalIn 0.25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.hp-close{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#aaa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hp-close:hover{background:rgba(255,255,255,0.2);color:#fff}
.hp-body{padding:28px}
.hp-body h3{font-size:20px;margin-bottom:14px;color:#fff}
.hp-body h4{font-size:13px;color:#60a5fa;margin:14px 0 6px}
.hp-body p,.hp-body li{font-size:13px;color:#b0b0b0;line-height:1.7}
.hp-body ul{padding-left:16px;margin:4px 0 8px}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0f0f1a; color: #e0e0e0; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

/* 导航 */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,26,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 0 20px;
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; height: 56px;
}
.nav-brand { font-size: 18px; font-weight: 700; }
.nav-actions { display: flex; align-items: center; gap: 12px; }
.nav-actions a { font-size: 13px; opacity: 0.6; transition: opacity 0.2s; }
.nav-actions a:hover { opacity: 1; }
.nav-actions button {
  padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
  background: transparent; color: #e0e0e0; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: background 0.2s;
}
.nav-actions button:hover { background: rgba(255,255,255,0.08); }

/* 标签条 */
.tags-bar {
  max-width: 1200px; margin: 0 auto; padding: 16px 20px 8px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.tag-chip {
  padding: 4px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
  font-size: 13px; cursor: pointer; background: transparent; color: #aaa;
  font-family: inherit; transition: all 0.2s;
}
.tag-chip:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
.tag-chip.active { background: #e94560; border-color: #e94560; color: #fff; }

/* 格言网格 */
.quotes-grid {
  max-width: 1200px; margin: 0 auto; padding: 12px 20px 60px;
  columns: 3 280px; column-gap: 16px;
}
@media (max-width: 900px) { .quotes-grid { columns: 2 240px; } }
@media (max-width: 560px) { .quotes-grid { columns: 1; } }

/* 卡片 */
.quote-card {
  break-inside: avoid; margin-bottom: 16px;
  padding: 20px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  transition: border-color 0.2s, transform 0.2s;
  position: relative;
}
.quote-card:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-2px); }
.quote-card .quote-text { font-size: 16px; line-height: 1.7; margin-bottom: 10px; }
.quote-card .quote-meta { font-size: 13px; color: #888; }
.quote-card .quote-meta strong { color: #bbb; }
.quote-card .quote-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.quote-card .quote-tags span {
  font-size: 11px; padding: 1px 8px; border-radius: 10px;
  background: rgba(255,255,255,0.06); color: #999;
  cursor: pointer; transition: background 0.15s;
}
.quote-card .quote-tags span:hover { background: rgba(255,255,255,0.14); }
.quote-card .card-actions {
  position: absolute; top: 14px; right: 16px;
  display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s;
}
.quote-card:hover .card-actions { opacity: 1; }
.quote-card .card-actions button {
  background: none; border: none; color: #666; cursor: pointer;
  font-size: 14px; padding: 2px 6px; transition: color 0.15s;
}
.quote-card .card-actions button:hover { color: #e94560; }
.quote-card .card-actions button.faved { color: #e94560; }
.quote-card.pending { opacity: 0.6; border-style: dashed; }

/* 弹窗 */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-panel {
  background: #1a1a2e; border-radius: 16px; max-width: 480px; width: 100%;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  padding: 28px; position: relative; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.modal-close {
  position: absolute; top: 12px; right: 16px; width: 30px; height: 30px;
  border-radius: 50%; border: none; background: rgba(255,255,255,0.1);
  color: #aaa; font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
.modal-panel h2 { margin-bottom: 20px; font-size: 20px; }
.modal-panel label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
.modal-panel input, .modal-panel textarea {
  width: 100%; padding: 10px 14px; margin-bottom: 16px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
  color: #e0e0e0; font-size: 14px; font-family: inherit; resize: vertical;
}
.modal-panel input:focus, .modal-panel textarea:focus { outline: none; border-color: #e94560; }
.modal-panel textarea { min-height: 100px; }
.modal-panel .submit-btn {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: #e94560; color: #fff; font-size: 15px; cursor: pointer;
  font-family: inherit; transition: background 0.2s;
}
.modal-panel .submit-btn:hover { background: #c0392b; }

/* 空态 */
.empty-state { text-align: center; padding: 60px 20px; color: #666; }
.empty-state p { font-size: 15px; }

/* 通知 */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 600;
  padding: 10px 24px; border-radius: 20px; background: #2a2a3e; color: #fff;
  font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  animation: fadeIn 0.3s ease; pointer-events: none;
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="https://being221.github.io" class="nav-brand">🧱 格言墙</a>
    <div class="nav-actions">
          <a href="https://being221.github.io">← 主页</a>
      <button id="submitBtn">+ 投稿</button>
    </div>
  </div>
</nav>

<div class="tags-bar" id="tagsBar">
  <button class="tag-chip active" data-tag="">全部</button>
</div>

<main class="quotes-grid" id="quotesGrid"></main>

<div class="modal-overlay" id="modal">
  <div class="modal-panel">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>投稿格言</h2>
    <label>格言内容 *</label>
    <textarea id="formText" placeholder="写下那句打动你的话..."></textarea>
    <label>作者（可选）</label>
    <input id="formAuthor" placeholder="如：鲁迅">
    <label>出处（可选）</label>
    <input id="formSource" placeholder="如：《呐喊》">
    <label>标签（逗号分隔）</label>
    <input id="formTags" placeholder="如：哲学, 人生">
    <button class="submit-btn" id="formSubmit">提交 · 等待审核</button>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  var sb = window.supabase.createClient(
    "https://codndkieecddabbqhdtg.supabase.co",
    "sb_publishable_wgX79e2z2kgcWKkhmDZIuw_Pd3FCj8E"
  );

  var deviceId = localStorage.getItem("sb_device_id");
  if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem("sb_device_id", deviceId); }
  var isAdmin = function() { return localStorage.getItem("sb_admin") === "true"; };

  var faves = JSON.parse(localStorage.getItem("qw_faves") || "[]");
  var activeTag = "";
  var allQuotes = [];

  // ===== 加载 =====
  async function loadQuotes() {
    var query = sb.from("quotes").select("*").order("created_at", { ascending: false });
    if (!isAdmin()) query = query.eq("approved", true);
    var res = await query;
    if (res.error) { console.error(res.error); return; }
    allQuotes = res.data || [];

    // 随机打乱
    for (var i = allQuotes.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = allQuotes[i]; allQuotes[i] = allQuotes[j]; allQuotes[j] = t;
    }

    renderQuotes();
    renderTags();
  }

  function renderTags() {
    var tagSet = {};
    allQuotes.forEach(function(q) {
      var tags = safeParse(q.tags);
      tags.forEach(function(t) { tagSet[t] = (tagSet[t]||0)+1; });
    });
    var html = '<button class="tag-chip' + (activeTag===""?" active":"") + '" data-tag="">全部</button>';
    Object.keys(tagSet).sort().forEach(function(t) {
      html += '<button class="tag-chip' + (activeTag===t?" active":"") + '" data-tag="' + t + '">' + t + ' (' + tagSet[t] + ')</button>';
    });
    document.getElementById("tagsBar").innerHTML = html;
  }

  function renderQuotes() {
    var filtered = activeTag
      ? allQuotes.filter(function(q) { return safeParse(q.tags).indexOf(activeTag) >= 0; })
      : allQuotes;

    if (filtered.length === 0) {
      document.getElementById("quotesGrid").innerHTML = '<div class="empty-state"><p>📭 该标签下还没有格言</p></div>';
      return;
    }

    var html = "";
    filtered.forEach(function(q) {
      var isFaved = faves.indexOf(q.id) >= 0;
      var tagHtml = safeParse(q.tags).map(function(t) { return '<span>' + t + '</span>'; }).join("");
      var adminHtml = "";
      if (isAdmin()) {
        if (!q.approved) {
          adminHtml = '<button data-approve="' + q.id + '" style="color:#4ade80;font-size:12px" title="通过">✓</button>' +
            '<button data-reject="' + q.id + '" style="color:#f87171;font-size:14px" title="拒绝">✕</button>';
        } else {
          adminHtml = '<button data-delete="' + q.id + '" style="color:#f87171;font-size:12px" title="删除">🗑</button>';
        }
      }
      var pendingClass = q.approved ? "" : " pending";

      html += '<div class="quote-card' + pendingClass + '">' +
        '<div class="card-actions">' +
          '<button class="' + (isFaved ? "faved" : "") + '" data-fav="' + q.id + '">' + (isFaved ? "❤️" : "🤍") + '</button>' +
          adminHtml +
        '</div>' +
        '<p class="quote-text">' + esc(q.text) + '</p>' +
        '<p class="quote-meta">— <strong>' + esc(q.author || "佚名") + '</strong>' +
        (q.source ? ' · <em>' + esc(q.source) + '</em>' : '') + '</p>' +
        '<div class="quote-tags">' + tagHtml + '</div>' +
      '</div>';
    });
    document.getElementById("quotesGrid").innerHTML = html;
  }

  // ===== 收藏 =====
  document.getElementById("quotesGrid").addEventListener("click", function(e) {
    var btn = e.target.closest("[data-fav]");
    if (btn) {
      var id = parseInt(btn.dataset.fav);
      var idx = faves.indexOf(id);
      if (idx >= 0) { faves.splice(idx, 1); } else { faves.push(id); }
      localStorage.setItem("qw_faves", JSON.stringify(faves));
      renderQuotes();
    }
  });

  // ===== 管理员操作 =====
  document.getElementById("quotesGrid").addEventListener("click", async function(e) {
    var approveBtn = e.target.closest("[data-approve]");
    var rejectBtn  = e.target.closest("[data-reject]");
    var deleteBtn  = e.target.closest("[data-delete]");

    if (approveBtn) {
      var id = parseInt(approveBtn.dataset.approve);
      await sb.from("quotes").update({ approved: true }).eq("id", id);
      loadQuotes(); toastMsg("已通过 ✓");
    }
    if (rejectBtn) {
      var rid = parseInt(rejectBtn.dataset.reject);
      await sb.from("quotes").delete().eq("id", rid);
      loadQuotes(); toastMsg("已拒绝");
    }
    if (deleteBtn) {
      var did = parseInt(deleteBtn.dataset.delete);
      if (confirm("删除这条格言？")) {
        await sb.from("quotes").delete().eq("id", did);
        loadQuotes(); toastMsg("已删除");
      }
    }
  });

  // ===== 标签筛选 =====
  document.getElementById("tagsBar").addEventListener("click", function(e) {
    var chip = e.target.closest(".tag-chip");
    if (!chip) return;
    activeTag = chip.dataset.tag;
    renderQuotes();
    renderTags();
  });

  // ===== 投稿弹窗 =====
  var modal = document.getElementById("modal");
  document.getElementById("submitBtn").addEventListener("click", function() {
    modal.classList.add("open");
  });
  document.getElementById("modalClose").addEventListener("click", function() {
    modal.classList.remove("open");
  });
  modal.addEventListener("click", function(e) {
    if (e.target === modal) modal.classList.remove("open");
  });
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && modal.classList.contains("open")) {
      modal.classList.remove("open");
    }
  });

  document.getElementById("formSubmit").addEventListener("click", async function() {
    var text   = document.getElementById("formText").value.trim();
    var author = document.getElementById("formAuthor").value.trim();
    var source = document.getElementById("formSource").value.trim();
    var tagsRaw = document.getElementById("formTags").value.trim();

    if (!text) { toastMsg("请输入格言内容"); return; }
    var tags = tagsRaw ? tagsRaw.split(/[,，]/).map(function(t){return t.trim();}).filter(Boolean) : [];

    var res = await sb.from("quotes").insert({
      text: text, author: author || null, source: source || null,
      tags: JSON.stringify(tags), approved: false, device_id: deviceId
    });

    if (res.error) { toastMsg("投稿失败: " + res.error.message); return; }

    modal.classList.remove("open");
    document.getElementById("formText").value = "";
    document.getElementById("formAuthor").value = "";
    document.getElementById("formSource").value = "";
    document.getElementById("formTags").value = "";
    toastMsg("投稿成功！等待审核后公开 ✨");
    loadQuotes();
  });

  // ===== 工具 =====
  function safeParse(str) { try { var r = JSON.parse(str); return Array.isArray(r) ? r : []; } catch(e) { return []; } }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function toastMsg(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.style.display = "block";
    setTimeout(function() { el.style.display = "none"; }, 2500);
  }

  // ===== 初始加载 =====
  loadQuotes();
})();
</script>
<button class="hp-btn" style="position:fixed;top:16px;right:16px;z-index:9999;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.6);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="document.getElementById('hp-overlay-quotes').classList.add('open')">?</button>
<div class="hp-overlay" id="hp-overlay-quotes" onclick="if(event.target===this)this.classList.remove('open')">
<div class="hp-panel">
<button class="hp-close" onclick="document.getElementById('hp-overlay-quotes').classList.remove('open')">&times;</button>
<div class="hp-body">
<h3>🧱 格言墙 · 使用说明</h3>
<h4>🖱️ 浏览</h4><p>卡片随机排列，每次刷新顺序不同。滚动发现打动你的句子。</p>
<h4>🔖 筛选</h4><p>顶部标签栏点选不同主题（哲学/文学/电影等），只显示该分类的格言。</p>
<h4>❤️ 收藏</h4><p>鼠标移到卡上出现心形按钮，点亮即收藏。存在本地浏览器中。</p>
<h4>📝 投稿</h4><p>点右上角「+ 投稿」填写格言和出处。默认隐藏，管理员审核后公开展示。</p>
<h4>🔐 管理员</h4><p>在主页 F12 Console 输入 localStorage.setItem("sb_admin","true") 刷新后审核待发布格言。</p>
</div></div></div>
</body></html>
