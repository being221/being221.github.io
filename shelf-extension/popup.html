<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { width: 280px; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; margin-bottom: 4px; color: #aaa; font-size: 11px; }
  input { width: 100%; padding: 6px 8px; margin-bottom: 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a3e; color: #fff; font-size: 12px; box-sizing: border-box; }
  button { width: 100%; padding: 8px; border: none; border-radius: 4px; background: #e94560; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #c0392b; }
  .hint { font-size: 10px; color: #888; margin-top: 8px; }
</style></head>
<body>
  <h3>📦 Shelf 设置</h3>
  <label for="url">Shelf 地址</label>
  <input type="text" id="url" placeholder="http://localhost:3000">
  <button id="save">保存</button>
  <p class="hint">本地默认 localhost:3000<br>线上用 being221.github.io/shelf</p>
  <script src="popup.js"></script>
</body>
</html>
